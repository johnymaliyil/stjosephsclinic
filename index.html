<style>
  :root{
    --bg:#FBF7EE; --surface:#FFFFFF; --surface-soft:#F1ECDF;
    --primary:#1F4A42; --primary-dark:#153530;
    --accent:#C08A3E; --accent-soft:#EFD9B0;
    --text:#262420; --text-muted:#736F64; --border:#E1D9C5;
    --danger:#B0432B; --danger-soft:#F6DCD3;
    --success:#3E6B49; --success-soft:#DCEADD;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:6px;border:1px solid transparent;font-weight:600;font-size:14px;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,transform .08s ease;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);box-shadow:0 3px 10px rgba(21,53,48,.25);}
  .btn-accent{background:var(--accent);color:#2A1D06;}
  .btn-accent:hover{background:#A87830;box-shadow:0 3px 10px rgba(160,120,48,.3);}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--primary);background:var(--surface-soft);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-small{padding:6px 12px;font-size:13px;border-radius:5px;}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text);width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
  label{font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .field{margin-bottom:14px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;}
  .container{max-width:1080px;margin:0 auto;padding:0 20px;}
  header.site{position:sticky;top:0;background:rgba(251,247,238,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);z-index:50;}
  .nav-row{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px;gap:12px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--primary-dark);}
  nav.links{display:flex;gap:4px;flex-wrap:wrap;}
  nav.links button{background:none;border:none;padding:8px 12px;border-radius:6px;font-size:14px;font-weight:500;color:var(--text-muted);transition:background .15s ease,color .15s ease;}
  nav.links button:hover{background:var(--surface-soft);color:var(--primary-dark);}
  nav.links button.active{color:var(--primary-dark);background:var(--surface-soft);font-weight:600;}
  .lang-toggle{display:flex;gap:2px;background:var(--surface-soft);border-radius:20px;padding:2px;margin-left:4px;}
  .lang-toggle button{padding:5px 10px;border-radius:18px;font-size:12px;font-weight:600;background:none;border:none;color:var(--text-muted);}
  .lang-toggle button.active{background:var(--primary);color:#fff;}
  .pulse-divider{width:100%;height:36px;display:block;}
  .hero{padding-top:64px;padding-bottom:40px;}
  .legacy-badge{display:inline-block;background:var(--accent-soft);border:1px solid var(--accent);color:var(--primary-dark);font-weight:600;font-size:13px;letter-spacing:.01em;padding:7px 16px;border-radius:999px;margin-bottom:18px;}
  .hero h1{font-size:40px;margin:0 0 14px;color:var(--primary-dark);max-width:620px;}
  .hero p.lead{font-size:17px;color:var(--text-muted);max-width:520px;margin:0 0 26px;}
  .info-strip{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px;}
  .info-strip .eyebrow{color:var(--accent);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  section{padding:36px 0;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .service-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .service-card h3{margin:0 0 6px;font-size:17px;color:var(--primary-dark);}
  .service-card p{margin:0;font-size:14px;color:var(--text-muted);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;}
  .badge-low{background:var(--danger-soft);color:var(--danger);}
  .badge-ok{background:var(--success-soft);color:var(--success);}
  .badge-warn{background:var(--accent-soft);color:#7A5312;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--text-muted);padding:8px 10px;border-bottom:2px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top;}
  td{transition:background .12s ease;}
  tr:hover td{background:var(--surface-soft);}
  .table-wrap{overflow-x:auto;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty-state .icon{font-size:28px;margin-bottom:8px;}
  .skeleton-row{height:14px;border-radius:4px;margin-bottom:10px;background:linear-gradient(90deg,var(--surface-soft) 25%,#E8E1CC 37%,var(--surface-soft) 63%);background-size:400% 100%;animation:skeletonShimmer 1.4s ease infinite;}
  @keyframes skeletonShimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
  footer.site{border-top:1px solid var(--border);padding:30px 0;margin-top:50px;color:var(--text-muted);font-size:13px;}
  .admin-shell{display:flex;min-height:100vh;}
  .admin-side{width:220px;background:var(--primary-dark);color:#fff;padding:22px 14px;flex-shrink:0;}
  .admin-side h2{font-size:16px;margin:0 0 20px;color:#fff;font-family:'Fraunces',serif;}
  .admin-side button{display:block;width:100%;text-align:left;background:none;border:none;color:#E9E4D6;padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:2px;transition:background .15s ease,color .15s ease;}
  .admin-side button:hover{background:rgba(255,255,255,.08);color:#fff;}
  .admin-side button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
  .admin-main{flex:1;padding:28px;max-width:960px;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;transition:box-shadow .15s ease,transform .1s ease,border-color .15s ease;}
  .stat-card-link{cursor:pointer;}
  .stat-card-link:hover{box-shadow:0 4px 14px rgba(31,74,66,.12);border-color:var(--primary);transform:translateY(-2px);}
  .stat-card .num{font-family:'Fraunces',serif;font-size:30px;color:var(--primary-dark);}
  .stat-card .label{font-size:12px;color:var(--text-muted);text-transform:uppercase;}
  .report-amount{cursor:pointer;border-bottom:1px dashed var(--border);padding-bottom:1px;}
  .report-amount:hover{color:var(--primary);border-bottom-color:var(--primary);}
  .report-row-clickable{cursor:pointer;}
  .report-row-clickable:hover{background:var(--surface-soft);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
  .row-actions{display:flex;gap:6px;}
  .top-alert{background:var(--accent-soft);color:#5A3D0E;border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:18px;animation:toastIn .25s ease;}
  .top-alert-success{background:var(--success-soft);color:#1F4A32;border-color:var(--success);font-weight:600;animation:toastPop .4s ease;}
  .public-toast-fixed{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:100;max-width:min(90vw,420px);box-shadow:0 4px 14px rgba(0,0,0,.15);margin-bottom:0;}
  .ad-banner{background:linear-gradient(90deg,var(--accent),#D9A94E);overflow:hidden;}
  .ad-banner a{display:block;text-decoration:none;color:#2A1D06;}
  .ad-marquee{overflow:hidden;white-space:nowrap;padding:9px 0;}
  .ad-marquee-track{display:inline-flex;animation:adMarquee 22s linear infinite;}
  .ad-marquee-track span{padding:0 36px;font-weight:700;font-size:14px;letter-spacing:.01em;flex-shrink:0;}
  @keyframes adMarquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion:reduce){.ad-marquee-track{animation:none;}.ad-marquee{overflow-x:auto;}}
  .promo-overlay{position:fixed;inset:0;background:rgba(21,53,48,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:promoFadeIn .2s ease;}
  .promo-modal{position:relative;background:var(--surface);border-radius:14px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;padding:26px 22px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:promoPopIn .25s ease;}
  .promo-close{position:absolute;top:10px;right:10px;background:var(--surface-soft);border:none;border-radius:50%;width:30px;height:30px;font-size:15px;line-height:1;color:var(--text-muted);cursor:pointer;}
  .promo-close:hover{background:var(--danger-soft);color:var(--danger);}
  .promo-body{white-space:pre-wrap;font-size:14px;line-height:1.65;}
  .promo-body a{color:var(--primary);font-weight:700;}
  @keyframes promoFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes promoPopIn{from{opacity:0;transform:scale(.94) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
  @media (prefers-reduced-motion:reduce){.promo-overlay,.promo-modal{animation:none;}}
  @keyframes toastIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toastPop{0%{opacity:0;transform:translateY(-6px) scale(.92);}60%{opacity:1;transform:translateY(0) scale(1.04);}100%{transform:scale(1);}}
  .search-row{display:flex;gap:8px;flex-wrap:wrap;}
  .search-row select{max-width:150px;}
  .search-row input{max-width:260px;}
  .roadmap-svg{width:100%;height:auto;display:block;}
  .founder-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:8px;}
  .founder-photo{width:120px;height:120px;object-fit:cover;border-radius:50%;border:3px solid var(--accent-soft);}
  .founder-placeholder{width:120px;height:120px;border-radius:50%;background:var(--surface-soft);border:3px solid var(--accent-soft);display:flex;align-items:center;justify-content:center;}
  .wa-float{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:60;text-decoration:none;}
  .wa-float svg{width:28px;height:28px;}
  .chat-toggle{position:fixed;bottom:20px;right:90px;width:56px;height:56px;border-radius:50%;background:#fff;border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:60;cursor:pointer;padding:0;}
  .nurse-anim{animation:nurseBob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
  .nurse-eye{animation:nurseBlink 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes nurseBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  @keyframes nurseBlink{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.1);}}
  .chat-panel{position:fixed;bottom:88px;right:20px;width:320px;max-width:calc(100vw - 32px);height:440px;max-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:70;display:flex;flex-direction:column;overflow:hidden;}
  .chat-panel-header{background:var(--primary-dark);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .chat-close{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;padding:4px;line-height:1;}
  .chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);}
  .chat-bubble{max-width:84%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;}
  .chat-bubble-bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;}
  .chat-bubble-bot a{color:var(--primary-dark);}
  .chat-bubble-user{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .chat-quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .chat-quick-replies button{background:var(--surface-soft);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap;}
  .chat-quick-replies button:hover{border-color:var(--primary);}
  .chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .chat-input-row input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;min-width:0;}
  .chat-teaser{position:fixed;bottom:84px;right:20px;max-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:12px;border-bottom-right-radius:2px;padding:10px 26px 10px 12px;font-size:12.5px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.16);z-index:59;cursor:pointer;animation:chatTeaserIn .25s ease-out;}
  .chat-teaser-close{position:absolute;top:4px;right:6px;background:none;border:none;font-size:12px;color:var(--text-muted);cursor:pointer;padding:4px;}
  @keyframes chatTeaserIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .mobile-tabbar{display:none;}
  .admin-topbar-mobile{display:none;}
  .app-loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);}
  .app-loading-mark{animation:appLoadingPulse 1.7s ease-in-out infinite;}
  .app-loading-name{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--primary-dark);letter-spacing:.01em;}
  .app-loading-text{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);}
  @keyframes appLoadingPulse{0%,100%{opacity:.5;transform:scale(.92);}50%{opacity:1;transform:scale(1);}}
  @media (prefers-reduced-motion:reduce){.app-loading-mark,.skeleton-row,.top-alert,.top-alert-success,.nurse-anim,.nurse-eye,.chat-teaser{animation:none;}.stat-card-link:hover{transform:none;}}
  @media (max-width:720px){
    .admin-shell{flex-direction:column;}
    .admin-side{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;display:flex;overflow-x:auto;gap:2px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));z-index:65;box-shadow:0 -2px 10px rgba(0,0,0,.2);}
    .admin-side h2{display:none;}
    .admin-side button{white-space:nowrap;width:auto;}
    .admin-side button[data-nav="admin-info"], .admin-side button.admin-side-extra{display:none;}
    .admin-topbar-mobile{display:flex;position:fixed;left:0;right:0;top:0;z-index:66;background:var(--primary-dark);box-shadow:0 2px 10px rgba(0,0,0,.15);}
    .admin-topbar-mobile button{flex:1;background:none;border:none;color:#E9E4D6;padding:10px 4px;font-size:11px;font-weight:600;white-space:nowrap;}
    .admin-topbar-mobile button.active{background:rgba(255,255,255,.14);color:#fff;}
    .admin-main{padding-top:46px;padding-bottom:76px;}
    .hero h1{font-size:30px;}
    nav.links button.nav-page-btn{display:none;}
    footer.site{margin-bottom:64px;}
    .wa-float{bottom:78px;width:48px;height:48px;}
    .wa-float svg{width:24px;height:24px;}
    .chat-toggle{bottom:78px;width:48px;height:48px;right:78px;}
    .chat-panel{right:12px;left:12px;width:auto;max-width:none;bottom:136px;height:min(60vh,420px);}
    .chat-teaser{bottom:132px;right:12px;max-width:200px;}
    .mobile-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:65;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom);}
    .mobile-tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:8px 2px 7px;font-size:10px;font-weight:600;color:var(--text-muted);}
    .mobile-tabbar button .icon{font-size:19px;line-height:1;}
    .mobile-tabbar button.active{color:var(--primary-dark);}
  }
</style>
</head>
<body>
<div id="app">

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
  query, where, orderBy, limit, startAt, startAfter, endAt, getCountFromServer, writeBatch, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxagSLab2O_0OkiNmb7fdz6kM9MY_YM4E",
  authDomain: "st-josephs-clinic.firebaseapp.com",
  projectId: "st-josephs-clinic",
  storageBucket: "st-josephs-clinic.firebasestorage.app",
  messagingSenderId: "104417229861",
  appId: "1:104417229861:web:6e1af5e7a69070d0b893cc"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const fbFunctions = getFunctions(fbApp);

// Backstop for bugs: without this, an unexpected error anywhere (a typo, a missing
// field on old data, a third-party script failing) aborts silently -- no toast, no
// save, nothing on screen -- which is indistinguishable from the button just not
// working. Surface it instead, so it's visible without opening DevTools.

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthStartISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d - new Date(new Date().toDateString())) / 86400000);
}
function escapeHtml(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function loadingSkeleton(rows){
  const widths=['92%','76%','85%','62%','90%','70%'];
  return `<div style="padding:4px 0;">${Array.from({length:rows||5}).map((_,i)=>`<div class="skeleton-row" style="width:${widths[i%widths.length]};"></div>`).join('')}</div>`;
}
function waLink(phone){ return 'https://wa.me/'+String(phone||'').replace(/[^0-9]/g,''); }
function telLink(phone){ return 'tel:'+String(phone||'').replace(/[^0-9+]/g,''); }
function adBannerHtml(){
  const i = state.data.info;
  if(!i.adEnabled || !(i.adText||'').trim()) return '';
  const item = `<span>${escapeHtml(i.adText)}${i.adPhone?` — ${escapeHtml(i.adPhone)}`:''}</span>`;
  return `<div class="ad-banner"><a href="${telLink(i.adPhone)}" aria-label="Call about this ad">
    <div class="ad-marquee"><div class="ad-marquee-track">${item}${item}</div></div>
  </a></div>`;
}
function linkifyPhones(escapedText){
  return escapedText.replace(/(\+?\d[\d\-\s]{7,14}\d)/g, m => `<a href="tel:${m.replace(/[^\d+]/g,'')}">${m}</a>`);
}
function promoPopupHtml(){
  const i = state.data.info;
  if(!state.showPromoPopup || !i.popupEnabled || !(i.popupText||'').trim() || state.view.startsWith('admin-')) return '';
  return `<div class="promo-overlay" onclick="if(event.target===this) closePromoPopup()">
    <div class="promo-modal">
      <button class="promo-close" onclick="closePromoPopup()" aria-label="Close">✕</button>
      <div class="promo-body">${linkifyPhones(escapeHtml(i.popupText))}</div>
    </div>
  </div>`;
}
window.closePromoPopup = function(){
  state.showPromoPopup = false;
  try{ sessionStorage.setItem('stjosephs_promo_seen','1'); }catch(e){}

};

function chatBotToggleButton(){
  return `<button class="chat-toggle" onclick="toggleChatBot()" aria-label="Chat with our nurse assistant">${nurseAvatarSvg(34)}</button>`;
}
function chatBotGreeting(){
  const i = state.data.info;
  return `Welcome to ${escapeHtml(i.clinicName)}! I'm Nurse Asha 👩‍⚕️ How can I help — hours, location, doctors, services, or booking an appointment?`;
}
function chatTeaserHtml(){
  if(!state.chatTeaserVisible || state.chatOpen) return '';
  const i = state.data.info;
  return `<div class="chat-teaser" onclick="openChatFromTeaser()">
    <button class="chat-teaser-close" onclick="event.stopPropagation(); dismissChatTeaser();" aria-label="Dismiss">✕</button>
    <strong>Welcome to ${escapeHtml(i.clinicName)}!</strong> 👋<br>I'm Nurse Asha — tap to chat with me.
  </div>`;
}
window.dismissChatTeaser = function(){
  state.chatTeaserVisible = false;
  try{ sessionStorage.setItem('stjosephs_chat_teaser_seen','1'); }catch(e){}
  render();
};
window.openChatFromTeaser = function(){ toggleChatBot(); };
function chatBotReply(rawText){
  const t = rawText.toLowerCase();
  const i = state.data.info;
  const wa = i.whatsapp ? `<a href="${waLink(i.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>` : 'WhatsApp';
  if(/hour|time|open|close|timing/.test(t)){
    return `Our clinic hours are:<br><strong>${escapeHtml(i.hours)}</strong>`;
  }
  if(/address|location|where|direction|map/.test(t)){
    const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(i.address);
    return `We're located at:<br>${escapeHtml(i.address)}<br><a href="${mapUrl}" target="_blank" rel="noopener">Get directions</a>`;
  }
  if(/phone|call|contact|number/.test(t)){
    return `You can reach us at <strong>${escapeHtml(i.phone)}</strong> or message us on ${wa}.`;
  }
  if(/doctor|physician|pediatric|specialist/.test(t)){
    const list = (i.doctors||[]).map(d=>`• <strong>${escapeHtml(d.name)}</strong> — ${escapeHtml(d.role||'')}`).join('<br>');
    return `Our doctors:<br>${list||'Please call us for doctor availability.'}`;
  }
  if(/appointment|book|schedule/.test(t)){
    return `You can book an appointment right here on the website.<br><button class="btn btn-primary btn-small" style="margin-top:6px;" onclick="setView('book')">Book an appointment</button>`;
  }
  if(/lab|thyrocare|hba1c|blood test/.test(t)){
    const list = (i.labTests||[]).map(l=>`• ${escapeHtml(l.name)}`).join('<br>');
    return `We offer these lab tests:<br>${list||'Please call us for available lab tests.'}`;
  }
  if(/service|treatment|diabet/.test(t)){
    const list = (i.services||[]).map(s=>`• ${escapeHtml(s.name)}`).join('<br>');
    return `Our services include:<br>${list||'Please call us for our full range of services.'}`;
  }
  if(/feedback|complain|review/.test(t)){
    return `We'd love to hear from you!<br><button class="btn btn-outline btn-small" style="margin-top:6px;" onclick="setView('feedback')">Share feedback</button>`;
  }
  if(/^(hi|hello|hey)\b/.test(t)){
    return chatBotGreeting();
  }
  return `I'm not totally sure about that. For anything specific, please call us at <strong>${escapeHtml(i.phone)}</strong> or message us on ${wa}.`;
}
function chatPanelHtml(){
  const msgs = state.chatMessages.map(m=>`<div class="chat-bubble chat-bubble-${m.from}">${m.from==='user'?escapeHtml(m.text):m.text}</div>`).join('');
  const quick = [['🕒 Hours','hours'],['📍 Location','location'],['🩺 Services','services'],['👨‍⚕️ Doctors','doctors'],['📅 Book appointment','book an appointment'],['🧪 Lab tests','lab tests']];
  return `<div class="chat-panel">
    <div class="chat-panel-header">
      ${nurseAvatarSvg(32)}
      <div style="flex:1;"><strong>Nurse Asha</strong><div style="font-size:11px;opacity:.85;">Here to help</div></div>
      <button class="chat-close" onclick="toggleChatBot()" aria-label="Close chat">✕</button>
    </div>
    <div class="chat-messages" id="chat-messages">${msgs}</div>
    <div class="chat-quick-replies">${quick.map(([label,topic])=>`<button onclick="chatQuickReply('${topic}')">${label}</button>`).join('')}</div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" placeholder="Type your question…" onkeydown="if(event.key==='Enter')sendChatMessage()">
      <button class="btn btn-primary btn-small" onclick="sendChatMessage()">Send</button>
    </div>
  </div>`;
}
function scrollChatToBottom(){
  setTimeout(()=>{ const el=document.getElementById('chat-messages'); if(el) el.scrollTop = el.scrollHeight; }, 30);
}
window.toggleChatBot = function(){
  state.chatOpen = !state.chatOpen;
  if(state.chatOpen){
    if(!state.chatMessages.length){ state.chatMessages.push({from:'bot', text:chatBotGreeting()}); }
    if(state.chatTeaserVisible){
      state.chatTeaserVisible = false;
      try{ sessionStorage.setItem('stjosephs_chat_teaser_seen','1'); }catch(e){}
    }
  }
  render(); scrollChatToBottom();
};
window.chatQuickReply = function(topic){
  state.chatMessages.push({from:'user', text:topic});
  state.chatMessages.push({from:'bot', text:chatBotReply(topic)});
  render(); scrollChatToBottom();
};
window.sendChatMessage = function(){
  const input = document.getElementById('chat-input');
  const text = (input?input.value:'').trim();
  if(!text) return;
  state.chatMessages.push({from:'user', text});
  state.chatMessages.push({from:'bot', text:chatBotReply(text)});
  render(); scrollChatToBottom();
};

  }

function initGoogleAnalytics(){
  const i = state.data.info;
  if(!i.gaMeasurementId || window.__gaLoaded) return;
  window.__gaLoaded = true;
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(i.gaMeasurementId);
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', i.gaMeasurementId, { send_page_view:false });
  if(!state.view.startsWith('admin-')) trackPageView();
}
function trackPageView(){
  const i = state.data.info;
  if(!(window.gtag && i.gaMeasurementId)) return;
  window.gtag('event', 'page_view', { page_path:'/'+state.view, page_title:state.view, page_location:location.href });
}

function billEmailText(b){
  const lines = [`Bill #${b.billNumber} — ${b.date}`, `Patient: ${b.patientName} (OPD ${b.patientOpdNo||'—'})`];
  if(b.patientPhone) lines.push(`Phone: ${b.patientPhone}`);
  lines.push('');
  if(b.medItems && b.medItems.length){
    lines.push('Medicines:');
    b.medItems.forEach(m=>lines.push(`  - ${m.name} x${m.quantity} @ ₹${Number(m.unitPrice).toFixed(2)} = ₹${(m.quantity*m.unitPrice).toFixed(2)}`));
  }
  if(b.extraItems && b.extraItems.length){
    lines.push('Services:');
    b.extraItems.forEach(x=>lines.push(`  - ${x.description}: ₹${Number(x.amount).toFixed(2)}`));
  }

}

function vitalsSummary(v){
  return [
    v.weight?`Wt ${v.weight} kg`:'', v.height?`Ht ${v.height} cm`:'', v.bp?`BP ${v.bp}`:'',
    v.sugarValue?`Sugar ${v.sugarValue} mg/dL${v.sugarType?` (${v.sugarType})`:''}`:''

}
function visitEmailText(v){
  const lines = [`Patient visit — ${v.date}`, `Patient: ${v.patientName} (OPD ${v.patientOpdNo||'—'})`];
  if(v.patientPhone) lines.push(`Phone: ${v.patientPhone}`);
  lines.push(`Doctor: ${v.doctorName||'—'}`, `Reason: ${v.reason||'—'}`);
  const vitals = vitalsSummary(v);
  if(vitals) lines.push(`Vitals: ${vitals}`);
  if(v.medicines && v.medicines.length){
    lines.push('', 'Prescribed medicines:');
    v.medicines.forEach(m=>lines.push(`  - ${m.name}${m.quantity?` x${m.quantity}`:''}${m.dosage?` (${m.dosage})`:''}${m.source==='outside'?' [prescribed externally — to order]':''}`));
  }
  return lines.join('\n');
}
function appointmentEmailText(a){
  const lines = [`New appointment request`, `Name: ${a.name}`, `Phone: ${a.phone}`];
  if(a.consultationType) lines.push(`Consultation type: ${a.consultationType}`);
  if(a.date) lines.push(`Preferred date: ${a.date}`);
  if(a.reason) lines.push(`Reason: ${a.reason}`);
  return lines.join('\n');
}
function feedbackEmailText(f){
  const lines = [`New patient feedback`];
  lines.push(`Name: ${f.name||'Anonymous'}`);
  if(f.phone) lines.push(`Phone: ${f.phone}`);

}

    body: "ഒരു ചെറിയ കുട്ടിക്ക് പ്രമേഹം സ്ഥിരീകരിക്കുന്നത് തുടക്കത്തിൽ ഏതൊരു കുടുംബത്തിനും ഭയപ്പെടുത്തുന്ന അനുഭവമായിരിക്കാം. എന്നാൽ ശരിയായ ദൈനംദിന ശീലങ്ങളിലൂടെ, പ്രമേഹമുള്ള മിക്ക കുട്ടികളും പൂർണ്ണവും സജീവവുമായ ജീവിതം നയിക്കുന്നു.\n\n1. സ്ഥിരമായ നിരീക്ഷണം: പതിവായ ബ്ലഡ് ഷുഗർ പരിശോധനകളും ഇടയ്ക്കിടെയുള്ള HbA1c ടെസ്റ്റുകളും, ഒറ്റപ്പെട്ട നമ്പറുകളല്ല, മറിച്ച് കൃത്യമായ ട്രെൻഡ് മനസ്സിലാക്കാൻ നിങ്ങളെയും ഡോക്ടറെയും സഹായിക്കുന്നു.\n\n2. നിയന്ത്രണമല്ല, സന്തുലിതമായ ഭക്ഷണം: പ്രമേഹമുള്ള കുട്ടികൾക്ക് കുടുംബത്തിലെ മറ്റുള്ളവരിൽ നിന്ന് പൂർണ്ണമായും വ്യത്യസ്തമായ ഭക്ഷണക്രമം ആവശ്യമില്ല - കാർബോഹൈഡ്രേറ്റിന്റെ സമയവും അളവും ശ്രദ്ധിച്ചാൽ മതി, അത് ഡോക്ടറുമായോ ഡയറ്റീഷ്യനുമായോ ചേർന്ന് തീരുമാനിക്കാം.\n\n3. സ്ഥിരമായ ശാരീരിക പ്രവർത്തനം: കളിയും വ്യായാമവും ശരീരത്തിന് ഇൻസുലിൻ കൂടുതൽ ഫലപ്രദമായി ഉപയോഗിക്കാൻ സഹായിക്കുന്നു. പ്രവർത്തന സമയത്ത് ഷുഗർ കുറയാൻ സാധ്യതയുള്ളതിനാൽ വേഗത്തിൽ ഫലിക്കുന്ന ഒരു മധുരപലഹാരം കയ്യിൽ കരുതുക.\n\n4. ലളിതമായ ഒരു പങ്കിട്ട ദിനചര്യ: പ്രായത്തിനനുസരിച്ച് കുട്ടിയെ സ്വന്തം പരിചരണത്തിൽ ഉൾപ്പെടുത്തുന്നത് - ഷുഗർ ലെവൽ പരിശോധിക്കുക, ഭക്ഷണ തിരഞ്ഞെടുപ്പ് മനസ്സിലാക്കുക - വളരുന്തോറും ആത്മവിശ്വാസവും സ്വാതന്ത്ര്യബോധവും വളർത്തുന്നു.\n\n5. ചികിത്സാ സംഘവുമായുള്ള തുറന്ന ആശയവിനിമയം: ഓരോ കുട്ടിയും ചികിത്സയോട് ഒരേപോലെ പ്രതികരിക്കില്ല. കുട്ടി വളരുന്നതിനനുസരിച്ച് പ്ലാൻ ക്രമീകരിക്കാൻ പതിവായ ഫോളോ-അപ്പുകൾ സഹായിക്കും.\n\nനിങ്ങൾ ഒറ്റയ്ക്കല്ല ഇത് കൈകാര്യം ചെയ്യുന്നത് - പതിവ് നിരീക്ഷണത്തിനും മരുന്ന് ക്രമീകരണത്തിനും ഇടയ്ക്കുള്ള ഏത് സംശയത്തിനും ഞങ്ങളുടെ ടീം കൂടെയുണ്ട്." },
  { title: "കുട്ടികളിലെ പനി: എപ്പോൾ ആശങ്കപ്പെടണം, എപ്പോൾ കാത്തിരിക്കാം",
    body: "രാത്രി രണ്ട് മണിക്ക് ചൂടും അസ്വസ്ഥതയുമുള്ള ഒരു കുട്ടിയെപ്പോലെ രക്ഷിതാക്കളെ അസ്വസ്ഥരാക്കുന്ന കാര്യങ്ങൾ കുറവാണ് - എന്നാൽ പനി തന്നെ അപൂർവ്വമായി മാത്രമേ അപകടകരമാകാറുള്ളൂ. കുട്ടിയുടെ പ്രതിരോധശേഷി അണുബാധയ്ക്കെതിരെ പോരാടുന്നു എന്നതിന്റെ സാധാരണ സൂചനയാണ് ഇത്.\n\n3 മാസത്തിന് മുകളിൽ പ്രായമുള്ള കുട്ടികളിൽ, മറ്റ് ആശങ്കാജനകമായ ലക്ഷണങ്ങളൊന്നുമില്ലാതെ 102°F (38.9°C)ൽ താഴെയുള്ള പനി പലപ്പോഴും വിശ്രമവും ദ്രാവകങ്ങളും ഇളംവസ്ത്രവും ഉപയോഗിച്ച് വീട്ടിൽ തന്നെ കൈകാര്യം ചെയ്യാം. തെർമോമീറ്ററിലെ നമ്പറിൽ മാത്രം ശ്രദ്ധിക്കാതെ കുട്ടി എങ്ങനെ പെരുമാറുന്നു എന്ന് നിരീക്ഷിക്കുക - പനിക്കിടയിലും കളിക്കുകയും ദ്രാവകങ്ങൾ കുടിക്കുകയും ചെയ്യുന്ന കുട്ടി സാധാരണയായി അടിയന്തരാവസ്ഥയല്ല.\n\n3 മാസത്തിൽ താഴെ പ്രായമുള്ള കുട്ടിക്ക് ഏതെങ്കിലും തരത്തിലുള്ള പനി ഉണ്ടെങ്കിലോ, പനി 104°F (40°C) കടക്കുകയോ, 2-3 ദിവസത്തിലധികം നീണ്ടുനിൽക്കുകയോ, കഴുത്ത് വേദന, ശ്വാസതടസ്സം, അസാധാരണമായ മയക്കം, അമർത്തിയാൽ മാറാത്ത ചുവന്ന പാടുകൾ, ദ്രാവകം കുടിക്കാൻ വിസമ്മതിക്കൽ എന്നിവയോടൊപ്പം പനി വരികയോ ചെയ്താൽ ഉടൻ ഞങ്ങളെ ബന്ധപ്പെടുകയോ ചികിത്സ തേടുകയോ ചെയ്യുക.\n\nസംശയം തോന്നിയാൽ, എപ്പോൾ വേണമെങ്കിലും വിളിക്കുകയോ കുട്ടിയെ കൊണ്ടുവരികയോ ചെയ്യാം - നിങ്ങൾ ഒറ്റയ്ക്ക് ആശങ്കപ്പെടുന്നതിനേക്കാൾ ഞങ്ങൾ നിങ്ങൾക്ക് ധൈര്യം നൽകാൻ ആഗ്രഹിക്കുന്നു." },
  { title: "HbA1c എന്താണ്? ഈ ലളിതമായ രക്തപരിശോധന നിങ്ങളോട് പറയുന്നത്",
    body: "നിങ്ങൾക്കോ നിങ്ങളുടെ കുട്ടിക്കോ പ്രമേഹമുണ്ടെങ്കിൽ, മിക്കവാറും എല്ലാ വിസിറ്റിലും ഡോക്ടർ \"HbA1c\" എന്ന് പറയുന്നത് കേട്ടിട്ടുണ്ടാകും - എന്നാൽ ഇത് യഥാർത്ഥത്തിൽ എന്താണ് അളക്കുന്നത്?\n\nഒരു നിമിഷത്തെ അളവ് മാത്രം കാണിക്കുന്ന സാധാരണ ബ്ലഡ് ഷുഗർ പരിശോധനയിൽ നിന്ന് വ്യത്യസ്തമായി, കഴിഞ്ഞ 2-3 മാസത്തെ ശരാശരി ബ്ലഡ് ഷുഗർ നിലയാണ് HbA1c കാണിക്കുന്നത്. ചുവന്ന രക്താണുക്കളിൽ ഓക്സിജൻ വഹിക്കുന്ന പ്രോട്ടീനായ ഹീമോഗ്ലോബിനിൽ എത്ര ശതമാനത്തിൽ ഷുഗർ ഒട്ടിപ്പിടിച്ചിരിക്കുന്നു എന്ന് അളന്നാണ് ഇത് കണ്ടെത്തുന്നത് - ശരാശരി ബ്ലഡ് ഷുഗർ കൂടുതലായിരുന്നാൽ ഈ ശതമാനവും കൂടും.\n\nഒറ്റപ്പെട്ട ഉയർന്നതോ താഴ്ന്നതോ ആയ ഒരു റീഡിംഗിനോട് പ്രതികരിക്കുന്നതിന് പകരം, പ്രമേഹ പരിചരണത്തിന്റെ വലിയ ചിത്രം മനസ്സിലാക്കാൻ ഏറ്റവും ഉപകാരപ്രദമായ ഉപകരണങ്ങളിലൊന്നാണിത്. പ്രായവും ആരോഗ്യ ചരിത്രവും അനുസരിച്ച് ശരിയായ ലക്ഷ്യം വ്യത്യാസപ്പെടാവുന്നതിനാൽ, മിക്കവർക്കും ഡോക്ടർ വ്യക്തിഗതമായി തീരുമാനിക്കുന്ന ഒരു HbA1c ലക്ഷ്യമാണുണ്ടാവുക.\n\nഞങ്ങളുടെ ക്ലിനിക്കിൽ പതിവ് പ്രമേഹ നിരീക്ഷണത്തിന്റെ ഭാഗമായി HbA1c ടെസ്റ്റ് ലഭ്യമാണ് - എത്ര തവണ ഇത് പരിശോധിക്കണം, നിങ്ങളുടെ ഏറ്റവും പുതിയ ഫലം എന്താണ് അർത്ഥമാക്കുന്നത് എന്നിവ ഞങ്ങളോട് ചോദിച്ചറിയൂ." },
  { title: "വളരുന്ന കുട്ടികൾക്ക് ആരോഗ്യകരമായ ഭക്ഷണശീലങ്ങൾ",
    body: "കുട്ടിയെ നല്ല രീതിയിൽ ഭക്ഷണം കഴിപ്പിക്കുക എന്നത് ദിവസേനയുള്ള ഒരു വിലപേശൽ പോലെ തോന്നാം - എന്നാൽ കുട്ടിക്കാലത്ത് രൂപപ്പെടുന്ന ശീലങ്ങൾ പലപ്പോഴും മുതിർന്നപ്പോഴും തുടരാറുണ്ട്, അതിനാൽ ഇത് നിങ്ങളുടെ കുട്ടിയുടെ ദീർഘകാല ആരോഗ്യത്തിൽ നടത്താവുന്ന ഏറ്റവും വിലപ്പെട്ട നിക്ഷേപങ്ങളിലൊന്നാണ്.\n\nചില പ്രായോഗിക തുടക്കങ്ങൾ: ആദ്യമോ അഞ്ചാം തവണയോ നിരസിക്കപ്പെട്ടാലും വൈവിധ്യമാർന്ന ഭക്ഷണങ്ങൾ വീണ്ടും വീണ്ടും വാഗ്ദാനം ചെയ്യുക - പരിചയം പലപ്പോഴും സ്വീകാര്യതയ്ക്ക് മുന്നേ വരും. \"പ്ലേറ്റ് മുഴുവൻ കഴിക്കണം\" എന്ന് നിർബന്ധിക്കുന്നതിന് പകരം എത്രത്തോളം കഴിക്കണം എന്ന് കുട്ടിയെ തന്നെ തീരുമാനിക്കാൻ അനുവദിക്കുക. നിങ്ങൾ തന്നെ മാതൃക കാണിക്കുക - നിങ്ങൾ ആസ്വദിച്ച് കഴിക്കുന്ന പച്ചക്കറികൾ കുട്ടികൾ കൂടുതൽ എളുപ്പത്തിൽ കഴിക്കും.\n\nമധുരപാനീയങ്ങളും പാക്കറ്റ് ലഘുഭക്ഷണങ്ങളും ദിവസേനയുള്ള ശീലമാക്കാതെ, അപൂർവ്വമായ ട്രീറ്റുകളായി മാത്രം ഒതുക്കുക. വീട്ടിലെ സ്ഥിരം പാനീയങ്ങൾ വെള്ളവും (പ്രായത്തിനനുസരിച്ച അളവിൽ) പാലും ആയിരിക്കണം.\n\nനിങ്ങളുടെ കുട്ടിയുടെ വളർച്ചയെക്കുറിച്ചോ വിശപ്പിനെക്കുറിച്ചോ ഭക്ഷണശീലങ്ങളെക്കുറിച്ചോ ആശങ്കയുണ്ടെങ്കിൽ, ഞങ്ങളുടെ ടീം കുട്ടിയുടെ ഗ്രോത്ത് ചാർട്ട് പരിശോധിച്ച് പ്രായോഗികവും വ്യക്തിഗതവുമായ നിർദ്ദേശങ്ങൾ നൽകും - ഇത് ഒറ്റയ്ക്ക് കണ്ടെത്തേണ്ട ആവശ്യമില്ല." }
];
async function addSampleBlogPosts(list){
  const today = new Date();
  for(let idx=0; idx<list.length; idx++){
    const d = new Date(today); d.setDate(d.getDate() - idx*2);
    await addDoc(collection(db,'blogPosts'), { ...list[idx], date: d.toISOString().slice(0,10) });

window.savePurchaseForm = async function(){
  const f = state.purchaseForm;
  const distributorName = document.getElementById('pf-distributor').value.trim();
  const invoiceNumber = document.getElementById('pf-invoice').value.trim();
  const date = document.getElementById('pf-date').value;

  const validItems = f.items.filter(i=>(i.isNew?i.name.trim():i.medicineId) && Number(i.quantity)>0);
  if(!validItems.length){ showToast('Add at least one medicine with a quantity. / ദയവായി അളവ് സഹിതം ഒരു മരുന്നെങ്കിലും ചേർക്കുക.'); return; }
  const batch = writeBatch(db);
  const items = [];
  validItems.forEach(i=>{
    const quantity = Number(i.quantity);
    const purchasePrice = Number(i.purchasePrice)||0;
    if(i.isNew){
      const medRef = doc(collection(db,'medicines'));
      batch.set(medRef, {
        name:i.name.trim(), unit:i.unit.trim(), quantity, reorderLevel:0, price:0,
        batch:i.batch||'', expiry:i.expiry||'', createdAt:new Date().toISOString()
      });

    }else{
      const medUpdate = { quantity:increment(quantity) };
      if(i.batch) medUpdate.batch = i.batch;
      if(i.expiry) medUpdate.expiry = i.expiry;
      batch.update(doc(db,'medicines',i.medicineId), medUpdate);
      items.push({ medicineId:i.medicineId, name:i.name, unit:i.unit, quantity, purchasePrice, lineTotal:quantity*purchasePrice, batch:i.batch||'', expiry:i.expiry||'' });
    }
  });
  const totalAmount = items.reduce((s,i)=>s+i.lineTotal, 0);
  const purchaseRef = doc(collection(db,'purchases'));
  batch.set(purchaseRef, {
    distributorName, invoiceNumber, date, items, totalAmount,
    paymentStatus: f.paymentStatus==='paid' ? 'paid' : 'unpaid', notes,
    createdAtMillis: Date.now(), createdAt: new Date().toISOString()
  });
  try{
    await batch.commit();
  }catch(e){
    console.error(e);
    showToast('Could not save purchase — check the browser console for details. / പർച്ചേസ് സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല.');
    return;
  }
  resetPurchaseForm();
  lastVisiblePurchaseDoc=null; await Promise.all([loadPurchasesPage(true), loadMedicines()]);
  showToast('👍 Purchase recorded and inventory updated! / പർച്ചേസ് രേഖപ്പെടുത്തി, ഇൻവെന്ററി അപ്ഡേറ്റ് ചെയ്തു!', 'success'); render();
};

function resizeImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const w = Math.round(img.width*scale) || 1, h = Math.round(img.height*scale) || 1;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadLastVitals(patientId){
  try{
    // A plain equality filter (no orderBy on a different field) needs no composite
    // index, unlike where()+orderBy() together -- sort client-side instead so this
    // doesn't depend on an index existing.
    const q = query(collection(db,'visits'), where('patientId','==',patientId));
    const snap = await getDocs(q);
    if(snap.empty) return null;
    const visits = snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAtMillis||0)-(a.createdAtMillis||0));
    const v = visits.find(x=>x.weight||x.height||x.bp||x.sugarValue);
    if(!v) return null;
    return { date:v.date, weight:v.weight, height:v.height, bp:v.bp, sugarValue:v.sugarValue, sugarType:v.sugarType };
  }catch(e){ console.error('Could not load last vitals', e); return null; }
}
async function loadPreviousVisits(patientId, excludeVisitId){
  try{
    // Same equality-only filter as loadLastVitals, sorted client-side to avoid
    // needing a composite index.
    const q = query(collection(db,'visits'), where('patientId','==',patientId));
    const snap = await getDocs(q);
    return snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(v=>v.id!==excludeVisitId)
      .sort((a,b)=>(b.createdAtMillis||0)-(a.createdAtMillis||0));
  }catch(e){ console.error('Could not load previous visits', e); return []; }
}
function sugarTrendChartSvg(visits){
  const points = visits
    .filter(v=>v.sugarValue)
    .map(v=>({date:v.date||'', value:Number(v.sugarValue), type:v.sugarType||'Random'}))
    .filter(p=>!isNaN(p.value))
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(points.length < 2) return '';
  const typeColor = { Fasting:'#1F4A42', PP:'#C08A3E', Random:'#8A5A42' };
  const W = 560, H = 160, padL = 30, padR = 16, padT = 18, padB = 26;
  const values = points.map(p=>p.value);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const range = (maxV - minV) || 10;
  const yFor = v => padT + (H-padT-padB) * (1 - (v-minV+range*0.15)/(range*1.3));
  const xFor = i => padL + (W-padL-padR) * (points.length===1 ? 0 : i/(points.length-1));
  const linePoints = points.map((p,i)=>`${xFor(i).toFixed(1)},${yFor(p.value).toFixed(1)}`).join(' ');
  const dots = points.map((p,i)=>`
    <circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.value).toFixed(1)}" r="4" fill="${typeColor[p.type]||typeColor.Random}"/>
    <text x="${xFor(i).toFixed(1)}" y="${(yFor(p.value)-8).toFixed(1)}" font-size="10" text-anchor="middle" fill="#262420">${p.value}</text>
    <text x="${xFor(i).toFixed(1)}" y="${H-8}" font-size="9" text-anchor="middle" fill="#736F64">${escapeHtml(p.date.slice(5))}</text>
  `).join('');
  const legend = Object.entries(typeColor).map(([label,color])=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;"><span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block;"></span>${label}</span>`).join('');
  return `<div style="margin:10px 0 0;padding:10px 12px;background:var(--surface-soft);border-radius:8px;">
    <div style="font-weight:600;font-size:13px;margin-bottom:6px;">Blood sugar trend</div>
    <div style="font-size:11px;margin-bottom:4px;">${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;">
      <polyline points="${linePoints}" fill="none" stroke="#C08A3E" stroke-width="2"/>
      ${dots}
    </svg>
  </div>`;
}
function previousVisitsHtml(visits){
  if(!visits.length) return `<p style="color:var(--text-muted);font-size:13px;margin:8px 0 0;">No previous visits on record.</p>`;
  return `<div class="card" style="margin-top:8px;max-height:420px;overflow-y:auto;">
    ${sugarTrendChartSvg(visits)}
    ${visits.map(v=>`<div style="padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <strong class="mono">${escapeHtml(v.date||'')}</strong>
        ${v.doctorName?`<span style="color:var(--text-muted);font-size:12px;">${escapeHtml(v.doctorName)}</span>`:''}
      </div>
      ${v.reason?`<div style="margin-top:2px;">${escapeHtml(v.reason)}</div>`:''}
      ${(v.medicines&&v.medicines.length)?`<div style="margin-top:4px;font-size:13px;color:var(--text-muted);">${v.medicines.map(m=>`${escapeHtml(m.name)}${m.quantity?` × ${escapeHtml(String(m.quantity))}`:''}${m.source==='outside'?' (to order)':''}`).join(', ')}</div>`:''}
      ${vitalsSummary(v)?`<div class="mono" style="margin-top:4px;font-size:12px;color:var(--text-muted);">${escapeHtml(vitalsSummary(v))}</div>`:''}
    </div>`).join('')}
  </div>`;
}

  const outsideRows = f.meds.filter(m=>m.source==='outside' && (m.name||'').trim());
  const outsideMeds = outsideRows.map(m=>({ source:'outside', name:m.name.trim(), quantity:m.quantity?Number(m.quantity):null, dosage:(m.dosage||'').trim() }));
  const medicines = [...pharmacyMeds, ...outsideMeds];
  if(medicines.length===0){
    if(!confirm('No prescription or medicine details have been added for this visit.\nഈ സന്ദർശനത്തിന് കുറിപ്പടിയോ മരുന്ന് വിവരങ്ങളോ ചേർത്തിട്ടില്ല.\n\nSave anyway? / എന്നിരുന്നാലും സേവ് ചെയ്യണോ?')) return;
  }
  const data = {
    patientId:f.selectedPatient.id, patientName:f.selectedPatient.name, patientNameLower:(f.selectedPatient.name||'').toLowerCase(),
    patientOpdNo:f.selectedPatient.opdNo||'', patientPhone:f.selectedPatient.phone||'',
    date, reason, doctorName, medicines,
    weight, height, bp, sugarValue, sugarType: sugarValue ? sugarType : ''
  };
  const batch = writeBatch(db);
  if(state.editingVisit){
    const before = (state.editingVisit.medicines||[]).filter(m=>m.medicineId);
    const beforeMap = Object.fromEntries(before.map(m=>[m.medicineId, Number(m.quantity)||0]));
    const afterMap = Object.fromEntries(pharmacyMeds.map(m=>[m.medicineId, Number(m.quantity)||0]));
    const ids = new Set([...Object.keys(beforeMap), ...Object.keys(afterMap)]);
    ids.forEach(id=>{
      const delta = (afterMap[id]||0) - (beforeMap[id]||0);
      if(delta) batch.update(doc(db,'medicines',id), {quantity:increment(-delta)});
    });
    data.updatedBy = state.sessionStaffName || '';
    batch.update(doc(db,'visits',state.editingVisit.id), data);
  }else{
    data.enteredBy = state.sessionStaffName || '';
    data.createdAtMillis = Date.now(); data.createdAt = new Date().toISOString();
    const ref = doc(collection(db,'visits'));
    batch.set(ref, data);
    pharmacyMeds.forEach(m=>{ batch.update(doc(db,'medicines',m.medicineId), {quantity:increment(-m.quantity)}); });
  }
  try{
    await batch.commit();
  }catch(e){
    console.error(e);
    showToast('Could not save visit — check the browser console for details. / സന്ദർശനം സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല.');
    return;
  }
  resetVisitForm();
  lastVisibleVisitDoc=null; await Promise.all([loadVisitsPage(true), loadMedicines()]);
  showToast('👍 Visit saved! / സന്ദർശനം സേവ് ചെയ്തു!', 'success'); render();
  sendClinicEmail(`New patient visit — ${data.patientName}`, visitEmailText(data));
};

async function loadPatientVisitHistory(patientId){
  let patient = null;
  try{
    const snap = await getDoc(doc(db,'patients',patientId));
    if(snap.exists()) patient = { id:snap.id, ...snap.data() };
  }catch(e){ console.error('Could not load patient', e); }
  if(!patient) return null;
  let visits = [];
  try{
    // Equality-only filter, sorted client-side -- same composite-index-avoidance
    // pattern as loadLastVitals/loadPreviousVisits.
    const q = query(collection(db,'visits'), where('patientId','==',patientId));
    const snap = await getDocs(q);
    visits = snap.docs.map(d=>d.data()).sort((a,b)=>(a.createdAtMillis||0)-(b.createdAtMillis||0));
  }catch(e){ console.error('Could not load visits', e); return { patient, visits: null }; }
  return { patient, visits };
}

async function loadBillsPage(reset){
  state.billsLoading = true; render();

      q = reset || !lastVisibleBillDoc
        ? query(collection(db,'bills'), orderBy('createdAtMillis','desc'), limit(50))
        : query(collection(db,'bills'), orderBy('createdAtMillis','desc'), startAfter(lastVisibleBillDoc), limit(50));
    }else{
      q = reset || !lastVisibleBillDoc
        ? query(collection(db,'bills'), orderBy('patientNameLower'), startAt(term), endAt(term+''), limit(50))
        : query(collection(db,'bills'), orderBy('patientNameLower'), startAfter(lastVisibleBillDoc), endAt(term+''), limit(50));
    }
    const snap = await getDocs(q);

    state.data.bills = reset ? docs : state.data.bills.concat(docs);
    lastVisibleBillDoc = snap.docs.length ? snap.docs[snap.docs.length-1] : lastVisibleBillDoc;

}

function svgLineChart(points, opts){
  opts = opts || {};
  const w = opts.width || 640, h = opts.height || 220, color = opts.color || '#1F4A42';
  const pad = { l:40, r:16, t:16, b:30 };
  const values = points.map(p=>p.value);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const rangeV = (maxV - minV) || 1;
  const yLo = minV - rangeV*0.15, yHi = maxV + rangeV*0.15;
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  const xStep = points.length > 1 ? plotW/(points.length-1) : 0;
  const xy = points.map((p,i)=>({
    x: pad.l + i*xStep,
    y: pad.t + plotH - ((p.value - yLo)/(yHi - yLo))*plotH,
    ...p
  }));
  const gridLines = [0,0.5,1].map(f=>{
    const y = pad.t + plotH - f*plotH;
    const val = (yLo + f*(yHi-yLo)).toFixed(1);
    return `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}" stroke="#E1D9C5" stroke-width="1"/><text x="${pad.l-6}" y="${(y+4).toFixed(1)}" font-size="10" fill="#736F64" text-anchor="end">${val}</text>`;
  }).join('');
  const labelEvery = Math.max(1, Math.ceil(points.length/6));
  const xLabels = xy.filter((p,i)=>i%labelEvery===0 || i===xy.length-1)
    .map(p=>`<text x="${p.x.toFixed(1)}" y="${h-pad.b+16}" font-size="10" fill="#736F64" text-anchor="middle">${escapeHtml(p.label)}</text>`).join('');
  const polyPoints = xy.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const dots = xy.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"><title>${escapeHtml(p.label)}: ${p.value}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;">
    ${gridLines}
    <polyline points="${polyPoints}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
    ${xLabels}
  </svg>`;
}

async function loadLastPaidConsultation(patientId){
  try{
    // Equality-only filter, sorted client-side -- same composite-index-avoidance
    // pattern as loadLastVitals/loadPreviousVisits.
    const q = query(collection(db,'bills'), where('patientId','==',patientId));
    const snap = await getDocs(q);
    const bills = snap.docs.map(d=>d.data())
      .filter(b=>Number(b.consultationFee)>0 && b.date)
      .sort((a,b)=>(b.createdAtMillis||0)-(a.createdAtMillis||0));
    return bills[0] || null;
  }catch(e){ console.error('Could not check last paid consultation fee', e); return null; }
}

async function selectBillVisitObject(v){
  state.billForm.selectedVisit = v;
  state.billForm.visitQuery = '';
  state.billForm.visitResults = [];
  state.billForm.medItems = medItemsFromVisit(v);
  state.billForm.extraItems = [{description:'',amount:''}];
  state.billForm.registrationFeePatientId = null;
  state.billForm.consultationFeeNote = null;

  if(v.patientId){
    try{
      const snap = await getDoc(doc(db,'patients',v.patientId));
      if(snap.exists() && snap.data().registrationFeeCharged===false){
        const addRegFee = confirm('This is a new patient registration.\nഇത് ഒരു പുതിയ രോഗി രജിസ്ട്രേഷനാണ്.\n\nAdd the ₹20 registration fee to this bill? / ₹20 രജിസ്ട്രേഷൻ ഫീസ് ഈ ബില്ലിൽ ചേർക്കണോ?');
        if(addRegFee){
          state.billForm.extraItems = [{description:'Registration Fee', amount:20, isRegistrationFee:true}];
          state.billForm.registrationFeePatientId = v.patientId;
        }
      }
    }catch(e){ console.error('Could not check registration fee status', e); }
  }

  // Always ask rather than deciding silently -- staff know whether this visit
  // needs a fresh consultation better than a date-based rule can.
  let consultNote = '';
  if(v.patientId){
    try{
      const lastBill = await loadLastPaidConsultation(v.patientId);
      if(lastBill && lastBill.date){
        const visitDate = new Date((v.date||todayISO())+'T00:00:00');
        const lastDate = new Date(lastBill.date+'T00:00:00');
        const daysSince = Math.round((visitDate - lastDate) / 86400000);
        if(daysSince >= 0) consultNote = `\n\nLast paid on ${lastBill.date} (${daysSince} day${daysSince===1?'':'s'} ago).`;
      }
    }catch(e){ console.error('Could not check last paid consultation fee', e); }
  }
  const addConsultFee = confirm(`Add the ₹200 consultation fee for this bill? / ₹200 കൺസൾട്ടേഷൻ ഫീസ് ഈ ബില്ലിൽ ചേർക്കണോ?${consultNote}`);
  state.billForm.consultationFee = addConsultFee ? 200 : 0;
  state.billForm.consultationFeeNote = addConsultFee ? null : 'No consultation fee added for this bill.';
}

function billTotals(f){
  const medTotal = f.medItems.reduce((s,m)=>s+(Number(m.quantity)||0)*(Number(m.unitPrice)||0), 0);
  const extraTotal = f.extraItems.reduce((s,x)=>s+(Number(x.amount)||0), 0);
  const consultationFee = Number(f.consultationFee)||0;
  return { medTotal, extraTotal, consultationFee, grandTotal: medTotal+extraTotal+consultationFee };
}
async function computeNextBillNumber(){
  try{
    const q = query(collection(db,'bills'), orderBy('billNumber','desc'), limit(1));
    const snap = await getDocs(q);
    return snap.empty ? 1 : (Number(snap.docs[0].data().billNumber)||0)+1;
  }catch(e){ return Date.now(); }
}
window.saveBillForm = async function(){
  const f = state.billForm;
  if(!f.selectedVisit){ showToast('Please select a patient visit to bill. / ബിൽ ചെയ്യാൻ ഒരു സന്ദർശനം തിരഞ്ഞെടുക്കുക.'); return; }
  const consultationFee = document.getElementById('bf-consultation').value;
  f.consultationFee = consultationFee;
  const medItems = f.medItems.filter(m=>m.name && Number(m.quantity)>0).map(m=>({
    medicineId:m.medicineId||'', name:m.name, quantity:Number(m.quantity), unitPrice:Number(m.unitPrice)||0
  }));
  const extraItems = f.extraItems.filter(x=>x.description && Number(x.amount)>0).map(x=>({
    description:x.description, amount:Number(x.amount)
  }));
  const totals = billTotals({...f, medItems, extraItems});
  const v = f.selectedVisit;
  const editing = state.editingBill;
  const billNumber = editing ? editing.billNumber : await computeNextBillNumber();

  // Stock for medicines already prescribed on the visit was deducted when the visit was
  // saved. Only the difference between the bill's final quantities and the visit's original
  // quantities needs to be applied here (covers medicines added or increased at billing time).
  const visitMedMap = {};
  (v.medicines||[]).forEach(m=>{ if(m.medicineId) visitMedMap[m.medicineId] = (visitMedMap[m.medicineId]||0) + (Number(m.quantity)||0); });
  const billMedMap = {};
  medItems.forEach(m=>{ if(m.medicineId) billMedMap[m.medicineId] = (billMedMap[m.medicineId]||0) + (Number(m.quantity)||0); });
  const inventoryDelta = {};
  new Set([...Object.keys(visitMedMap), ...Object.keys(billMedMap)]).forEach(id=>{
    const delta = (billMedMap[id]||0) - (visitMedMap[id]||0);
    if(delta) inventoryDelta[id] = delta;
  });

  const data = {
    billNumber,
    visitId:v.id, patientId:v.patientId, patientName:v.patientName, patientNameLower:(v.patientName||'').toLowerCase(),
    patientOpdNo:v.patientOpdNo||'', patientPhone:v.patientPhone||'', visitDate:v.date||'',
    medItems, extraItems, consultationFee:totals.consultationFee,
    medTotal:totals.medTotal, extraTotal:totals.extraTotal, grandTotal:totals.grandTotal,
    paymentMethod: f.paymentMethod==='upi' ? 'upi' : 'cash',
    inventoryDelta,
    date: editing ? editing.date : todayISO(),
    createdAtMillis: editing ? editing.createdAtMillis : Date.now(),
    createdAt: editing ? editing.createdAt : new Date().toISOString()
  };
  if(editing){ data.updatedAt = new Date().toISOString(); data.updatedBy = state.sessionStaffName || ''; }
  else{ data.enteredBy = state.sessionStaffName || ''; }
  const registrationFeeKept = !editing && f.registrationFeePatientId && f.extraItems.some(x=>x.isRegistrationFee && x.description && Number(x.amount)>0);

  const ref = editing ? doc(db,'bills',editing.id) : doc(collection(db,'bills'));
  const batch = writeBatch(db);
  if(editing){
    batch.update(ref, data);
    // Net stock adjustment vs. what this bill had already deducted -- not the full
    // inventoryDelta, since that was already applied when this bill was first saved.
    const oldDelta = editing.inventoryDelta || {};
    new Set([...Object.keys(oldDelta), ...Object.keys(inventoryDelta)]).forEach(medId=>{
      const net = (inventoryDelta[medId]||0) - (oldDelta[medId]||0);
      if(net) batch.update(doc(db,'medicines',medId), {quantity:increment(-net)});
    });
  }else{
    batch.set(ref, data);
    batch.update(doc(db,'visits',v.id), {billId:ref.id, billNumber});
    Object.entries(inventoryDelta).forEach(([medId,delta])=>{ batch.update(doc(db,'medicines',medId), {quantity:increment(-delta)}); });
  }
  if(registrationFeeKept){ batch.update(doc(db,'patients',f.registrationFeePatientId), {registrationFeeCharged:true}); }
  try{
    await batch.commit();
  }catch(e){
    console.error(e);
    showToast('Could not save bill — check the browser console for details. / ബിൽ സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല.');
    return;
  }
  resetBillForm();
  lastVisibleBillDoc=null; await Promise.all([loadBillsPage(true), loadVisitsPage(true), loadMedicines()]);
  showToast(editing?'👍 Bill updated! / ബിൽ അപ്ഡേറ്റ് ചെയ്തു!':'👍 Bill saved! / ബിൽ സേവ് ചെയ്തു!', 'success'); render();
  if(!editing) sendClinicEmail(`New bill #${data.billNumber} — ${data.patientName}`, billEmailText(data));
  if(!editing && data.patientPhone){ window.open(waLinkWithText(data.patientPhone, billThankYouMessage(data)), '_blank'); }
  printBill({id:ref.id, ...data});
};
window.deleteBill = async function(id){

  const batch = writeBatch(db);
  batch.delete(doc(db,'bills',id));
  if(b.visitId) batch.update(doc(db,'visits',b.visitId), {billId:null, billNumber:null});
  Object.entries(b.inventoryDelta||{}).forEach(([medId,delta])=>{ batch.update(doc(db,'medicines',medId), {quantity:increment(delta)}); });
  try{
    await batch.commit();
  }catch(e){ console.error(e); showToast('Could not delete bill. / ബിൽ ഡിലീറ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല.'); return; }

};

function formatAttendanceDuration(ms){

function formatIST(iso){

async function loadOldChartProgress(){
  try{
    // Equality-only filter, sorted/filtered client-side -- same composite-index-avoidance
    // pattern as loadLastVitals/loadPreviousVisits.
    const snap = await getDocs(query(collection(db,'vaccinations'), where('fromOldChart','==',true)));
    const today = todayISO();
    state.oldChartEntriesToday = snap.docs.filter(d=>(d.data().createdAt||'').slice(0,10)===today).length;
  }catch(e){ console.error('Could not load old-chart backlog progress', e); state.oldChartEntriesToday = 0; }
}
async function loadVaccinationsDue(){
  try{
    const [patientsSnap, vaccSnap] = await Promise.all([
      getDocs(collection(db,'patients')),
      getDocs(collection(db,'vaccinations'))
    ]);
    const given = {};
    vaccSnap.docs.forEach(d=>{
      const v = d.data();
      if(!v.patientId || !v.vaccineKey) return;
      if(!given[v.patientId]) given[v.patientId] = new Set();
      given[v.patientId].add(v.vaccineKey);
    });
    const today = new Date();
    const due = [];
    patientsSnap.docs.forEach(d=>{
      const p = d.data();
      if(!p.dob) return;
      const dob = new Date(p.dob+'T00:00:00');
      const ageDays = Math.floor((today - dob) / 86400000);
      if(ageDays < 0) return;
      const givenSet = given[d.id] || new Set();
      const nextDue = VACCINE_SCHEDULE.find(item => ageDays >= item.dueDays && !givenSet.has(item.key));
      if(nextDue){
        due.push({
          patientId:d.id, patientName:p.name, patientOpdNo:p.opdNo, patientPhone:p.phone,
          vaccineKey:nextDue.key, vaccineLabel:nextDue.label,
          daysOverdue: Math.round(ageDays - nextDue.dueDays)
        });
      }
    });
    due.sort((a,b)=>b.daysOverdue-a.daysOverdue);
    state.vaccinationsDue = due;
  }catch(e){ console.error('Could not compute vaccinations due', e); state.vaccinationsDue = []; }
}

/* ---------- backup / export ---------- */
async function fetchAllDocs(collectionName, orderField, onProgress){
  if(!orderField){
    const snap = await getDocs(collection(db,collectionName));
    const results = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(onProgress) onProgress(results.length);
    return results;
  }
  const results = [];
  let lastDoc = null;
  while(true){
    const q = lastDoc
      ? query(collection(db,collectionName), orderBy(orderField), startAfter(lastDoc), limit(1000))
      : query(collection(db,collectionName), orderBy(orderField), limit(1000));
    const snap = await getDocs(q);
    snap.docs.forEach(d=>results.push({id:d.id, ...d.data()}));
    if(onProgress) onProgress(results.length);
    if(snap.docs.length < 1000) break;
    lastDoc = snap.docs[snap.docs.length-1];
  }
  return results;
}
function csvEscape(v){
  const s = (v===undefined||v===null)?'':String(v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(rows, columns){
  const header = columns.map(c=>csvEscape(c.label)).join(',');
  const lines = rows.map(r=>columns.map(c=>csvEscape(typeof c.value==='function'?c.value(r):r[c.value])).join(','));
  return [header, ...lines].join('\r\n');
}
function downloadCSV(filename, csv){
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function runExport(label, collectionName, orderField, columns, filenamePrefix){
  if(state.backupExporting) return;
  state.backupExporting = label; render();
  try{
    const rows = await fetchAllDocs(collectionName, orderField, (n)=>{ state.backupExporting = `${label} (${n} so far)…`; render(); });
    const csv = toCSV(rows, columns);
    downloadCSV(`${filenamePrefix}-${todayISO()}.csv`, csv);
    showToast(`Downloaded ${rows.length} ${label.toLowerCase()}. / ഡൗൺലോഡ് ചെയ്തു.`);
  }catch(e){
    console.error(e);
    showToast(`Could not export ${label.toLowerCase()} — check the browser console for details. / എക്സ്പോർട്ട് ചെയ്യാൻ കഴിഞ്ഞില്ല.`);
  }
  state.backupExporting = ''; render();
}

  state.isAdmin = !!user;
  if(user){
    if(!state.sessionStaffName){
      try{ state.sessionStaffName = sessionStorage.getItem('sessionStaffName') || null; }catch(e){}
    }
    if(!state.dailyReminderSeen){
      try{ state.dailyReminderSeen = sessionStorage.getItem('dailyReminderSeen')==='1'; }catch(e){}
    }
    startStaffReminders();
  } else {
    stopStaffReminders();
  }
  if(user){
    const remindAction = new URLSearchParams(location.search).get('remind');
    if(remindAction){
      history.replaceState(null,'',location.pathname);
      handleReminderAction(remindAction);
      return;
    }
  }
  if(user && (state.view==='home' || state.view==='admin-login')){
    let savedView = null;
    try{ savedView = localStorage.getItem('lastAdminView'); }catch(e){}
    if(savedView && savedView.startsWith('admin-') && savedView!=='admin-login'){ setView(savedView); return; }
    if(state.view==='admin-login'){ setView('admin-dashboard'); return; }
  }
  render();
});

async function loadDashboardStats(){
  try{ state.patientCount = (await getCountFromServer(collection(db,'patients'))).data().count; }
  catch(e){ console.error('Failed to load registered patient count', e); state.patientCount = null; }
  try{ state.visitCount = (await getCountFromServer(collection(db,'visits'))).data().count; }
  catch(e){ console.error('Failed to load patient visit count', e); state.visitCount = null; }
  await Promise.all([loadMedicines(), loadAppointments()]);
  state.followUpsDue = await loadFollowUpsDue();
  await loadReorderAlerts();
  await loadVaccinationsDue();
}
async function loadFollowUpsDue(){
  try{
    // Same equality-free, sort-client-side approach as loadLastVitals/loadPreviousVisits,
    // avoiding a composite index for a query that would otherwise need one.
    const snap = await getDocs(collection(db,'visits'));
    const latestByPatient = {};
    snap.docs.forEach(d=>{
      const v = d.data();
      if(!v.sugarValue || !v.date || !v.patientId) return;
      if(!latestByPatient[v.patientId] || v.date > latestByPatient[v.patientId].date){
        latestByPatient[v.patientId] = v;
      }
    });
    const today = new Date();
    return Object.values(latestByPatient)
      .map(v=>({ ...v, daysSinceLastVisit: Math.round((today - new Date(v.date+'T00:00:00')) / 86400000) }))
      .filter(v=>v.daysSinceLastVisit >= 90)
      .sort((a,b)=>b.daysSinceLastVisit-a.daysSinceLastVisit);
  }catch(e){ console.error('Could not load follow-ups due', e); return []; }
}
async function loadReorderAlerts(){
  const LOOKBACK_DAYS = 30;
  const ALERT_THRESHOLD_DAYS = 14;
  try{
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-LOOKBACK_DAYS);
    const cutoffISO = cutoff.toISOString().slice(0,10);
    const q = query(collection(db,'visits'), where('date','>=',cutoffISO));
    const snap = await getDocs(q);
    const dispensed = {};
    snap.docs.forEach(d=>{
      const v = d.data();
      (v.medicines||[]).forEach(m=>{
        if(m.source==='outside' || !m.medicineId) return;
        dispensed[m.medicineId] = (dispensed[m.medicineId]||0) + (Number(m.quantity)||0);
      });
    });
    state.reorderAlerts = state.data.medicines.map(med=>{
      const qtyUsed = dispensed[med.id]||0;
      const dailyRate = qtyUsed/LOOKBACK_DAYS;
      if(dailyRate<=0) return null;
      const daysLeft = (Number(med.quantity)||0)/dailyRate;
      if(daysLeft > ALERT_THRESHOLD_DAYS) return null;
      return { id:med.id, name:med.name, quantity:med.quantity, unit:med.unit, dailyRate, daysLeft: Math.round(daysLeft*10)/10 };
    }).filter(Boolean).sort((a,b)=>a.daysLeft-b.daysLeft);
  }catch(e){ console.error('Could not compute reorder alerts', e); state.reorderAlerts = []; }
}

  if(age<1 || age>17) return null;
  let mid;
  if(age<=6) mid = (age*2)+8;
  else if(age<=12) mid = (age*7-5)/2;
  else mid = (age*3.5)+10; // rough teen approximation
  const spread = mid*0.15;
  return { low: Math.round((mid-spread)*10)/10, high: Math.round((mid+spread)*10)/10 };
}
function pediatricHeightRangeCm(age){
  if(age<2 || age>12) return null;
  const mid = (age*6)+77;
  return { low: Math.round(mid-4), high: Math.round(mid+4) };
}
function adultIdealWeightRangeKg(heightCm){
  const h = Number(heightCm)/100;
  if(!h || h<=0) return null;
  // Same 18.5-23 "normal" BMI band used by the Health Check tool.
  return { low: Math.round(18.5*h*h*10)/10, high: Math.round(23*h*h*10)/10 };
}
// Only checked for children (the growth-chart ranges only cover ages 1-17) --
// staff should mention this to the patient/parent, not silently note it.
function pediatricVitalsWarnings(age, weight, height){
  const warnings = [];
  const ageNum = Number(age);
  if(isNaN(ageNum) || ageNum<=0 || ageNum>=18) return warnings;
  const w = Number(weight);
  if(w>0){
    const wr = pediatricWeightRangeKg(ageNum);
    if(wr && (w<wr.low || w>wr.high)){
      warnings.push(`Weight (${w} kg) is outside the typical range for age ${ageNum} (~${wr.low}–${wr.high} kg). Please inform the patient/parent.\nഭാരം (${w} കി.ഗ്രാം) പ്രായത്തിന് (${ageNum}) അനുയോജ്യമായ പരിധിക്ക് (~${wr.low}–${wr.high} കി.ഗ്രാം) പുറത്താണ്. ദയവായി രോഗിയെ/രക്ഷിതാവിനെ അറിയിക്കുക.`);
    }
  }
  const h = Number(height);
  if(h>0){
    const hr = pediatricHeightRangeCm(ageNum);
    if(hr && (h<hr.low || h>hr.high)){
      warnings.push(`Height (${h} cm) is outside the typical range for age ${ageNum} (~${hr.low}–${hr.high} cm). Please inform the patient/parent.\nഉയരം (${h} സെ.മീ) പ്രായത്തിന് (${ageNum}) അനുയോജ്യമായ പരിധിക്ക് (~${hr.low}–${hr.high} സെ.മീ) പുറത്താണ്. ദയവായി രോഗിയെ/രക്ഷിതാവിനെ അറിയിക്കുക.`);
    }
  }
  return warnings;
}
function healthCheckRecommendations(f){
  const age = Number(f.age)||0;
  const heightM = Number(f.height)/100;
  const weight = Number(f.weight);
  const bmi = (heightM>0 && weight>0) ? weight/(heightM*heightM) : null;
  let bmiCategoryKey = '';
  if(bmi!==null){
    if(bmi<18.5) bmiCategoryKey='bmi_underweight';
    else if(bmi<23) bmiCategoryKey='bmi_normal';
    else if(bmi<25) bmiCategoryKey='bmi_overweight';
    else bmiCategoryKey='bmi_obese';
  }
  const highRisk = f.familyHistory==='yes' || (bmi!==null && bmi>=23);
  const checks = [];
  if(age>0 && age<18){
    checks.push({nameKey:'check_pediatric_growth', freqKey:'freq_yearly'});
    checks.push({nameKey:'check_pediatric_general', freqKey:'freq_yearly'});
  }else{
    checks.push({nameKey:'check_bp', freqKey: age>=40 ? 'freq_yearly' : 'freq_1_2_years'});
    checks.push({nameKey:'check_sugar', freqKey: highRisk ? 'freq_6_12_months' : (age>=40 ? 'freq_yearly' : 'freq_3_years')});
    checks.push({nameKey:'check_lipid', freqKey: age>=40 ? 'freq_1_2_years' : 'freq_4_6_years'});
    checks.push({nameKey:'check_general', freqKey: age>=40 ? 'freq_yearly' : 'freq_2_3_years'});
    if(age>=40){
      checks.push({nameKey:'check_thyroid', freqKey:'freq_1_2_years'});
      checks.push({nameKey:'check_ecg', freqKey:'freq_1_2_years_advised'});
    }
    if(bmi!==null && bmi>=25){
      checks.push({nameKey:'check_diabetic_consult', freqKey:'freq_recommended_book'});
    }
  }
  return { bmi, bmiCategoryKey, checks };
}

}

async function buildSummaryText(label, fromDate, toDate){
  const i = state.data.info;
  const singleDay = fromDate===toDate;
  let visitsList = [], cashTotal = 0, upiTotal = 0;
  try{
    const visitSnap = await getDocs(query(collection(db,'visits'), where('date','>=',fromDate), where('date','<=',toDate)));
    visitsList = visitSnap.docs.map(d=>d.data()).sort((a,b)=>(a.createdAtMillis||0)-(b.createdAtMillis||0));
  }catch(e){ console.error('Could not load visits for summary', e); }
  try{
    const billSnap = await getDocs(query(collection(db,'bills'), where('date','>=',fromDate), where('date','<=',toDate)));
    billSnap.docs.forEach(d=>{
      const b = d.data();
      const amt = Number(b.grandTotal)||0;
      if(b.paymentMethod==='upi') upiTotal += amt; else cashTotal += amt;
    });
  }catch(e){ console.error('Could not load bills for summary', e); }
  const meds = state.data.medicines;
  const lowStockCount = meds.filter(m=>medStatus(m).label==='Low stock').length;
  const expiringCount = meds.filter(m=>['Expired','Expiring soon'].includes(medStatus(m).label)).length;
  const vaccinationsDueCount = (state.vaccinationsDue||[]).length;
  const rangeLabel = singleDay ? fromDate : `${fromDate} to ${toDate}`;
  const lines = [
    `${label} — ${i.clinicName}, ${rangeLabel}`,
    ``,
    `Patients seen: ${visitsList.length}`,
    `Collections: ${money(cashTotal+upiTotal)} (Cash ${money(cashTotal)}, UPI ${money(upiTotal)})`
  ];
  if(lowStockCount) lines.push(`⚠️ ${lowStockCount} medicine${lowStockCount>1?'s':''} low on stock`);
  if(expiringCount) lines.push(`⏰ ${expiringCount} medicine${expiringCount>1?'s':''} expired/expiring soon`);
  if(vaccinationsDueCount) lines.push(`💉 ${vaccinationsDueCount} vaccination${vaccinationsDueCount>1?'s':''} due`);
  if(singleDay && visitsList.length){
    const MAX_VISITS = 20;
    const patientAges = {};
    try{
      const patientIds = [...new Set(visitsList.map(v=>v.patientId).filter(Boolean))];
      await Promise.all(patientIds.map(async pid=>{
        try{
          const snap = await getDoc(doc(db,'patients',pid));
          if(snap.exists() && snap.data().age) patientAges[pid] = snap.data().age;
        }catch(e){ console.error('Could not load patient age', e); }
      }));
    }catch(e){ console.error('Could not load patient ages for summary', e); }
    lines.push('', 'Visit details:');
    visitsList.slice(0,MAX_VISITS).forEach(v=>{
      const age = patientAges[v.patientId];
      lines.push(`- ${v.patientName||'—'} (OPD ${v.patientOpdNo||'—'}${age?`, Age ${age}`:''}) — ${v.reason||'No reason recorded'}`);
      if(v.medicines && v.medicines.length){
        lines.push(`  Meds: ${v.medicines.map(m=>`${m.name}${m.quantity?` x${m.quantity}`:''}`).join(', ')}`);
      }else{
        lines.push('  Meds: none recorded');
      }
    });
    if(visitsList.length > MAX_VISITS){
      lines.push(`…and ${visitsList.length-MAX_VISITS} more visit${visitsList.length-MAX_VISITS===1?'':'s'}.`);
    }
  }else if(!singleDay && visitsList.length){
    const topReasons = visitReasonBreakdown(visitsList, 8);
    if(topReasons.length){
      lines.push('', 'Top visit reasons:');
      topReasons.forEach(r=>lines.push(`- ${r.label}: ${r.count}`));
    }
  }
  return lines.join('\n');
}

}

function viewAdminCleanliness(){

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  const needsAuth = state.view.startsWith('admin-') && state.view!=='admin-login';
  let html;
  if(needsAuth && !state.isAdmin){ html = viewAdminLogin(); }
  else if(needsAuth && !state.sessionStaffName){ html = viewStaffSelectGate(); }
  else if(needsAuth && !state.dailyReminderSeen && state.sessionStaffName!=='Admin'){ html = viewDailyReminderGate(); }
  else{
    switch(state.view){
      case 'home': html=viewHome(); break;
      case 'about': html=viewAbout(); break;
      case 'services': html=viewServices(); break;
      case 'blog': html=viewBlog(); break;
      case 'book': html=viewBook(); break;
      case 'admin-login': html= state.isAdmin ? viewAdminDashboard() : viewAdminLogin(); break;
      case 'admin-dashboard': html=viewAdminDashboard(); break;
      case 'admin-patients': html=viewAdminPatients(); break;
      case 'admin-visits': html=viewAdminVisits(); break;
      case 'admin-labtests': html=viewAdminLabTests(); break;
      case 'admin-vaccinations': html=viewAdminVaccinations(); break;
      case 'admin-billing': html=viewAdminBilling(); break;
      case 'admin-growth-chart': html=viewAdminGrowthChart(); break;
      case 'admin-reports': html=viewAdminReports(); break;
      case 'admin-inventory': html=viewAdminInventory(); break;
      case 'admin-purchases': html=viewAdminPurchases(); break;
      case 'admin-appointments': html=viewAdminAppointments(); break;
      case 'admin-backup': html=viewAdminBackup(); break;
      case 'admin-help': html=viewAdminHelp(); break;
      case 'admin-info': html=viewAdminInfo(); break;
      case 'admin-blog': html=viewAdminBlog(); break;
      case 'feedback': html=viewFeedback(); break;
      case 'healthcheck': html=viewHealthCheck(); break;
      case 'admin-feedback': html=viewAdminFeedback(); break;
      case 'admin-whatsapp': html=viewAdminWhatsapp(); break;
      case 'admin-attendance': html=viewAdminAttendance(); break;
      case 'admin-cleanliness': html=viewAdminCleanliness(); break;
      default: html=viewHome();
    }
  }
  app.innerHTML = html + promoPopupHtml();
  const existingToast = document.getElementById('public-toast');
  if(existingToast) existingToast.remove();
  if(state.toast && !state.view.startsWith('admin-')){
    const el = document.createElement('div');
    el.id = 'public-toast';
    el.className = 'top-alert public-toast-fixed' + (state.toastType==='success' ? ' top-alert-success' : '');
    el.textContent = state.toast;
    document.body.appendChild(el);
  }
}
window.render = render;
window.state = state;

async function initApp(){
  try{ if(localStorage.getItem('stjosephs_lang')==='ml') state.lang='ml'; }catch(e){}
  await loadClinicInfo();
  await loadBlogPosts();
  let seen = false;
  try{ seen = sessionStorage.getItem('stjosephs_promo_seen')==='1'; }catch(e){}
  if(!seen && state.data.info.popupEnabled && (state.data.info.popupText||'').trim() && !state.view.startsWith('admin-')){
    state.showPromoPopup = true;
  }
  render();
  trackPageView();
  let teaserSeen = false;
  try{ teaserSeen = sessionStorage.getItem('stjosephs_chat_teaser_seen')==='1'; }catch(e){}
  if(!teaserSeen){
    setTimeout(()=>{
      if(!state.view.startsWith('admin-') && !state.chatOpen){ state.chatTeaserVisible = true; render(); }
    }, 2500);
  }
}
initApp();
