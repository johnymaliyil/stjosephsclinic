<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St Joseph's Children's & Diabetic Clinic</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23153530'/%3E%3Ccircle cx='32' cy='32' r='27' stroke='%23C08A3E' stroke-width='2' fill='none'/%3E%3Cpath d='M10 33H24L28 18L36 48L41 33H54' stroke='%23F1ECDF' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23153530'/%3E%3Ccircle cx='32' cy='32' r='27' stroke='%23C08A3E' stroke-width='2' fill='none'/%3E%3Cpath d='M10 33H24L28 18L36 48L41 33H54' stroke='%23F1ECDF' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FBF7EE; --surface:#FFFFFF; --surface-soft:#F1ECDF;
    --primary:#1F4A42; --primary-dark:#153530;
    --accent:#C08A3E; --accent-soft:#EFD9B0;
    --text:#262420; --text-muted:#736F64; --border:#E1D9C5;
    --danger:#B0432B; --danger-soft:#F6DCD3;
    --success:#3E6B49; --success-soft:#DCEADD;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:6px;border:1px solid transparent;font-weight:600;font-size:14px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#2A1D06;}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--primary);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-small{padding:6px 12px;font-size:13px;border-radius:5px;}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text);width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;}
  label{font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .field{margin-bottom:14px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;}
  .container{max-width:1080px;margin:0 auto;padding:0 20px;}
  header.site{position:sticky;top:0;background:rgba(251,247,238,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);z-index:50;}
  .nav-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:12px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--primary-dark);}
  nav.links{display:flex;gap:4px;flex-wrap:wrap;}
  nav.links button{background:none;border:none;padding:8px 12px;border-radius:6px;font-size:14px;font-weight:500;color:var(--text-muted);}
  nav.links button.active{color:var(--primary-dark);background:var(--surface-soft);font-weight:600;}
  .pulse-divider{width:100%;height:36px;display:block;}
  .hero{padding:64px 0 40px;}
  .hero h1{font-size:40px;margin:0 0 14px;color:var(--primary-dark);max-width:620px;}
  .hero p.lead{font-size:17px;color:var(--text-muted);max-width:520px;margin:0 0 26px;}
  .info-strip{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px;}
  .info-strip .eyebrow{color:var(--accent);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  section{padding:36px 0;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  .service-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .service-card h3{margin:0 0 6px;font-size:17px;color:var(--primary-dark);}
  .service-card p{margin:0;font-size:14px;color:var(--text-muted);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;}
  .badge-low{background:var(--danger-soft);color:var(--danger);}
  .badge-ok{background:var(--success-soft);color:var(--success);}
  .badge-warn{background:var(--accent-soft);color:#7A5312;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--text-muted);padding:8px 10px;border-bottom:2px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:hover td{background:var(--surface-soft);}
  .table-wrap{overflow-x:auto;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty-state .icon{font-size:28px;margin-bottom:8px;}
  footer.site{border-top:1px solid var(--border);padding:30px 0;margin-top:50px;color:var(--text-muted);font-size:13px;}
  .admin-shell{display:flex;min-height:100vh;}
  .admin-side{width:220px;background:var(--primary-dark);color:#fff;padding:22px 14px;flex-shrink:0;}
  .admin-side h2{font-size:16px;margin:0 0 20px;color:#fff;font-family:'Fraunces',serif;}
  .admin-side button{display:block;width:100%;text-align:left;background:none;border:none;color:#E9E4D6;padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:2px;}
  .admin-side button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
  .admin-main{flex:1;padding:28px;max-width:960px;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .stat-card .num{font-family:'Fraunces',serif;font-size:30px;color:var(--primary-dark);}
  .stat-card .label{font-size:12px;color:var(--text-muted);text-transform:uppercase;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
  .row-actions{display:flex;gap:6px;}
  .top-alert{background:var(--accent-soft);color:#5A3D0E;border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:18px;}
  .search-row{display:flex;gap:8px;flex-wrap:wrap;}
  .search-row select{max-width:150px;}
  .search-row input{max-width:260px;}
  .roadmap-svg{width:100%;height:auto;display:block;}
  .founder-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:8px;}
  .founder-photo{width:120px;height:120px;object-fit:cover;border-radius:50%;border:3px solid var(--accent-soft);}
  .founder-placeholder{width:120px;height:120px;border-radius:50%;background:var(--surface-soft);border:3px solid var(--accent-soft);display:flex;align-items:center;justify-content:center;}
  .app-loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);}
  .app-loading-mark{animation:appLoadingPulse 1.7s ease-in-out infinite;}
  .app-loading-name{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--primary-dark);letter-spacing:.01em;}
  .app-loading-text{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);}
  @keyframes appLoadingPulse{0%,100%{opacity:.5;transform:scale(.92);}50%{opacity:1;transform:scale(1);}}
  @media (prefers-reduced-motion:reduce){.app-loading-mark{animation:none;}}
  @media (max-width:720px){
    .admin-shell{flex-direction:column;}
    .admin-side{width:100%;display:flex;overflow-x:auto;gap:2px;padding:10px;}
    .admin-side h2{display:none;}
    .admin-side button{white-space:nowrap;width:auto;}
    .hero h1{font-size:30px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="app-loading">
    <div class="app-loading-mark">
      <svg width="46" height="46" viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="14" stroke="#C08A3E" stroke-width="1.5"/>
        <path d="M4 15 H10 L12.5 8 L17 22 L19.5 15 H26" stroke="#1F4A42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="app-loading-name">St Joseph's Clinic</div>
    <div class="app-loading-text">Loading…</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
  query, orderBy, limit, startAt, startAfter, endAt, getCountFromServer, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxagSLab2O_0OkiNmb7fdz6kM9MY_YM4E",
  authDomain: "st-josephs-clinic.firebaseapp.com",
  projectId: "st-josephs-clinic",
  storageBucket: "st-josephs-clinic.firebasestorage.app",
  messagingSenderId: "104417229861",
  appId: "1:104417229861:web:6e1af5e7a69070d0b893cc"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d - new Date(new Date().toDateString())) / 86400000);
}
function escapeHtml(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const DEFAULT_INFO = {
  clinicName: "St Joseph's Children's & Diabetic Clinic",
  tagline: "Caring for children and families managing diabetes.",
  address: "Dr M M Varkey Memorial Building, Near Silver Hills NAXA Cinemas, Thodupuzha P.O, Idukki, Pin 685584",
  phone: "04862-222620",
  hours: "Mon–Sat: 9:30–1:30 & 4:30–7:30 | Sun: By appointment, 10:00–12:00",
  welcomeText: "Hi, welcome to St. Joseph Hospital & Children's Clinic. Dr. Joseph Varkey and his dedicated team have made all efforts to ensure that your experience here is a pleasant one. Our speciality is paediatrics.\n\nSt. Joseph Hospital & Children's Clinic is a friendly, child-centered, family-oriented local clinic for children. This is a very child-friendly clinic with a welcoming atmosphere. Parents and children are free to ask any questions with regard to their health. Each consultation lasts around 15 to 30 minutes. You will be given guidance about your child's growth and development, and the latest information about any aspects of your child's illness. At St. Joseph Hospital & Children's Clinic, vaccination visits are also optimally utilised to provide guidance regarding diet (including nutritional counselling), parenting issues, physical exercise and healthy lifestyle from an early age, and prevention of injuries.",
  aboutUsText: "St. Joseph's Hospital and Children's Clinic, Thodupuzha was started in the year 1950 by Late Dr. M. M. Varkey, MBBS. He started a nursing home and served the people of Thodupuzha for more than 25 years. The confidence and trust of his patients, his very hard work, and his tenacity of purpose along with the goodwill of friends and relatives helped us through. We thank God for all His mercies and guidance over the years.",
  founderName: "Founder Dr M M Varkey",
  founderPhotoUrl: "",
  doctors: [
    { name: "Dr. Joseph Varkey", qualification: "MBBS, MD", role: "In-house Pediatrician" },
    { name: "Dr. Mathew Varkey", qualification: "MBBS, MD (Physician & Diabetologist)", role: "Visiting Consultant" },
    { name: "Dr. Ranjith Varkey Joseph", qualification: "BSc, MBBS, MRCP", role: "Online Consultation" }
  ],
  services: [
    { name: "Pediatric Consultation", description: "General child health checkups, growth monitoring, and vaccinations." },
    { name: "Diabetic Care & Monitoring", description: "Blood sugar management, diet guidance, and follow-up consultations." },
    { name: "In-house Pharmacy", description: "Prescribed medicines available directly at the clinic." }
  ],
  labTests: [
    { name: "Thyrocare Laboratory", description: "India's largest laboratory chain — we are an authorised Thyrocare collection point, samples are couriered to Thyrocare labs and reports shared once ready." },
    { name: "Blood Sugar (Fasting / PP / Random)", description: "Routine diabetes monitoring tests, available at the clinic." },
    { name: "HbA1c", description: "3-month average blood sugar test for diabetic patients." },
    { name: "Thyroid Profile", description: "T3, T4, TSH panel via Thyrocare." },
    { name: "Complete Blood Count (CBC)", description: "General health and infection screening." }
  ]
};

let state = {
  view:'home', isAdmin:false, loginError:'', toast:'',
  patientsSearchField:'name', patientsSearchTerm:'', patientsLoading:false, hasMorePatients:false,
  nextOpdNoCache:1,
  medSearch:'', editingPatient:null, editingMed:null,
  patientCount:null,
  data:{ patients:[], medicines:[], appointments:[], blogPosts:[], info:DEFAULT_INFO }
};
let lastVisibleDoc = null;

/* ---------- clinic info ---------- */
const infoRef = doc(db,'clinicInfo','main');
async function loadClinicInfo(){
  const snap = await getDoc(infoRef);
  if(snap.exists()){ state.data.info = Object.assign({}, DEFAULT_INFO, snap.data()); }
  else{ state.data.info = DEFAULT_INFO; await setDoc(infoRef, DEFAULT_INFO); }
}
window.saveClinicInfo = async function(){
  const i = state.data.info;
  i.clinicName = document.getElementById('if-name').value.trim() || i.clinicName;
  i.phone = document.getElementById('if-phone').value.trim();
  i.tagline = document.getElementById('if-tagline').value.trim();
  i.address = document.getElementById('if-address').value.trim();
  i.hours = document.getElementById('if-hours').value.trim();
  i.welcomeText = document.getElementById('if-welcome').value.trim();
  i.aboutUsText = document.getElementById('if-about').value.trim();
  i.founderName = document.getElementById('if-founder-name').value.trim();
  i.founderPhotoUrl = document.getElementById('if-founder-photo').value.trim();
  await setDoc(infoRef, i);
  showToast('Clinic info saved.');
};
window.doctorEditor = null; // placeholder, real fn below
function doctorEditor(items){
  const rows = (items||[]).map((d,idx)=>`
    <div class="card" style="margin-bottom:10px;">
      <div class="form-grid">
        <div class="field"><label>Name</label><input type="text" value="${escapeHtml(d.name)}" onchange="updateDoctor(${idx},'name',this.value)"></div>
        <div class="field"><label>Qualification</label><input type="text" value="${escapeHtml(d.qualification||'')}" onchange="updateDoctor(${idx},'qualification',this.value)"></div>
        <div class="field"><label>Role</label><input type="text" value="${escapeHtml(d.role||'')}" onchange="updateDoctor(${idx},'role',this.value)"></div>
      </div>
      <button class="btn btn-danger btn-small" onclick="removeDoctor(${idx})">Remove</button>
    </div>`).join('');
  return `${rows}<button class="btn btn-outline btn-small" onclick="addDoctor()">+ Add doctor</button>`;
}
window.addDoctor = function(){ (state.data.info.doctors=state.data.info.doctors||[]).push({name:'New Doctor',qualification:'',role:''}); setDoc(infoRef,state.data.info); render(); };
window.removeDoctor = function(idx){ state.data.info.doctors.splice(idx,1); setDoc(infoRef,state.data.info); render(); };
window.updateDoctor = function(idx,key,val){ state.data.info.doctors[idx][key]=val; setDoc(infoRef,state.data.info); };
function listEditor(field, items){
  const rows = (items||[]).map((it,idx)=>`
    <div class="card" style="margin-bottom:10px;">
      <div class="form-grid">
        <div class="field"><label>Name</label><input type="text" value="${escapeHtml(it.name)}" onchange="updateListItem('${field}',${idx},'name',this.value)"></div>
        <div class="field" style="grid-column:1/-1;"><label>Description</label><input type="text" value="${escapeHtml(it.description||'')}" onchange="updateListItem('${field}',${idx},'description',this.value)"></div>
      </div>
      <button class="btn btn-danger btn-small" onclick="removeListItem('${field}',${idx})">Remove</button>
    </div>`).join('');
  return `${rows}<button class="btn btn-outline btn-small" onclick="addListItem('${field}')">+ Add item</button>`;
}
window.addListItem = function(field){ state.data.info[field].push({name:'New item',description:''}); render(); };
window.removeListItem = function(field,idx){ state.data.info[field].splice(idx,1); setDoc(infoRef,state.data.info); render(); };
window.updateListItem = function(field,idx,key,val){ state.data.info[field][idx][key]=val; setDoc(infoRef,state.data.info); };

/* ---------- blog posts ---------- */
async function loadBlogPosts(){
  const snap = await getDocs(collection(db,'blogPosts'));
  state.data.blogPosts = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
}
window.addBlogPost = async function(){
  const ref = await addDoc(collection(db,'blogPosts'), {title:'New post title', body:'', date:todayISO()});
  await loadBlogPosts(); render();
};
window.updateBlogPost = async function(id,key,val){ await updateDoc(doc(db,'blogPosts',id), {[key]:val}); const p=state.data.blogPosts.find(x=>x.id===id); if(p) p[key]=val; };
window.removeBlogPost = async function(id){ await deleteDoc(doc(db,'blogPosts',id)); await loadBlogPosts(); render(); };

/* ---------- medicines ---------- */
async function loadMedicines(){
  const snap = await getDocs(collection(db,'medicines'));
  state.data.medicines = snap.docs.map(d=>({id:d.id,...d.data()}));
}
function medStatus(m){
  const qty=Number(m.quantity), reorder=Number(m.reorderLevel||0), exp=daysUntil(m.expiry);
  if(exp!==null && exp<0) return {label:'Expired',cls:'badge-low'};
  if(exp!==null && exp<=30) return {label:'Expiring soon',cls:'badge-warn'};
  if(qty<=reorder) return {label:'Low stock',cls:'badge-low'};
  return {label:'OK',cls:'badge-ok'};
}
window.editMed = function(id){ state.editingMed = state.data.medicines.find(x=>x.id===id); render(); window.scrollTo(0,0); };
window.deleteMed = async function(id){ await deleteDoc(doc(db,'medicines',id)); await loadMedicines(); render(); };
window.saveMedForm = async function(){
  const name=document.getElementById('mf-name').value.trim();
  const batch=document.getElementById('mf-batch').value.trim();
  const expiry=document.getElementById('mf-expiry').value;
  const quantity=document.getElementById('mf-qty').value;
  const unit=document.getElementById('mf-unit').value.trim();
  const reorderLevel=document.getElementById('mf-reorder').value;
  if(!name){ showToast('Medicine name is required.'); return; }
  const data={name,batch,expiry,quantity,unit,reorderLevel,updatedAt:new Date().toISOString()};
  if(state.editingMed){ await updateDoc(doc(db,'medicines',state.editingMed.id), data); state.editingMed=null; }
  else{ await addDoc(collection(db,'medicines'), data); }
  await loadMedicines(); showToast('Inventory updated.'); render();
};

/* ---------- appointments ---------- */
async function loadAppointments(){
  const snap = await getDocs(collection(db,'appointments'));
  state.data.appointments = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
}
window.submitAppointment = async function(){
  const name=document.getElementById('ap-name').value.trim();
  const phone=document.getElementById('ap-phone').value.trim();
  const date=document.getElementById('ap-date').value;
  const reason=document.getElementById('ap-reason').value.trim();
  if(!name || !phone){ showToast('Please enter your name and phone number.'); return; }
  await addDoc(collection(db,'appointments'), {name,phone,date,reason,status:'pending',createdAt:new Date().toISOString()});
  setView('home'); showToast('Appointment request sent. We will contact you to confirm.');
};
window.updateAppointmentStatus = async function(id,status){
  await updateDoc(doc(db,'appointments',id), {status});
  const a=state.data.appointments.find(x=>x.id===id); if(a) a.status=status;
  showToast('Status updated.');
};
window.deleteAppointment = async function(id){ await deleteDoc(doc(db,'appointments',id)); await loadAppointments(); render(); };

/* ---------- patients (paginated + indexed search) ---------- */
async function computeNextOpdNo(){
  try{
    const q = query(collection(db,'patients'), orderBy('opdNoNum','desc'), limit(1));
    const snap = await getDocs(q);
    state.nextOpdNoCache = snap.empty ? 1 : (Number(snap.docs[0].data().opdNoNum)||0)+1;
  }catch(e){ state.nextOpdNoCache = 1; }
}
async function loadPatientsPage(reset){
  state.patientsLoading = true; render();
  const term = state.patientsSearchTerm.trim();
  const fieldMap = {name:'nameLower', address:'addressLower', opdNo:'opdNo', phone:'phone'};
  const fieldName = fieldMap[state.patientsSearchField] || 'nameLower';
  let q;
  try{
    if(!term){
      q = reset || !lastVisibleDoc
        ? query(collection(db,'patients'), orderBy('registeredAtMillis','desc'), limit(50))
        : query(collection(db,'patients'), orderBy('registeredAtMillis','desc'), startAfter(lastVisibleDoc), limit(50));
    }else{
      const value = (state.patientsSearchField==='name'||state.patientsSearchField==='address') ? term.toLowerCase() : term;
      q = reset || !lastVisibleDoc
        ? query(collection(db,'patients'), orderBy(fieldName), startAt(value), endAt(value+'\uf8ff'), limit(50))
        : query(collection(db,'patients'), orderBy(fieldName), startAfter(lastVisibleDoc), endAt(value+'\uf8ff'), limit(50));
    }
    const snap = await getDocs(q);
    const docs = snap.docs.map(d=>({id:d.id,...d.data()}));
    state.data.patients = reset ? docs : state.data.patients.concat(docs);
    lastVisibleDoc = snap.docs.length ? snap.docs[snap.docs.length-1] : lastVisibleDoc;
    state.hasMorePatients = snap.docs.length === 50;
  }catch(e){
    console.error(e);
    showToast('Could not load patients — if Firestore shows an index error in the browser console, click the link it gives you to auto-create it.');
  }
  state.patientsLoading = false; render();
}

window.savePatientForm = async function(){

  const name=document.getElementById('pf-name').value.trim();
  const phone=document.getElementById('pf-phone').value.trim();
  const gender=document.getElementById('pf-gender').value;
  const age=document.getElementById('pf-age').value;
  const address=document.getElementById('pf-address').value.trim();
  if(!name || !opdNo){ showToast('OPD number and patient name are required.'); return; }
  const data = { opdNo, opdNoNum: parseInt(opdNo)||null, name, nameLower:name.toLowerCase(),
    phone, gender, age, address, addressLower:address.toLowerCase(), registeredAtMillis:Date.now(), registeredAt:new Date().toISOString() };
  if(state.editingPatient){ await updateDoc(doc(db,'patients',state.editingPatient.id), data); state.editingPatient=null; }
  else{ await addDoc(collection(db,'patients'), data); }
  lastVisibleDoc=null; await loadPatientsPage(true); await computeNextOpdNo();

window.importPatientFile = async function(){
  const fileInput = document.getElementById('import-file');
  const statusEl = document.getElementById('import-status');
  const resumeFrom = Math.max(0, parseInt(document.getElementById('import-resume').value, 10) || 0);
  const file = fileInput.files[0];
  if(!file){ statusEl.textContent='Choose a file first.'; return; }
  try{
    if(resumeFrom===0){
      const countSnap = await getCountFromServer(collection(db,'patients'));
      if(countSnap.data().count > 0){
        const proceed = confirm('There are already '+countSnap.data().count+' patients in the database. Importing again may create duplicate entries. Continue?');
        if(!proceed){ statusEl.textContent='Import cancelled.'; return; }
      }
    }
    statusEl.textContent = 'Reading file…';
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    let batch = writeBatch(db), opCount=0, validSeen=0, uploaded=0, skipped=0;
    for(const r of rows){
      const opdNo = String(r.OPregNos ?? r.opdNo ?? '').trim();
      const name = String(r.PatientName ?? r.name ?? '').trim();
      if(!opdNo || !name){ skipped++; continue; }
      validSeen++;
      if(validSeen<=resumeFrom) continue;
      const address = String(r.Address ?? '').trim();
      const ref = doc(collection(db,'patients'));
      batch.set(ref, {
        opdNo, opdNoNum: parseInt(opdNo)||null, name, nameLower:name.toLowerCase(),
        phone:String(r.PhoneNo ?? '').trim(), gender:String(r.Gender ?? '').trim(), age:String(r.Age ?? '').trim(),
        address, addressLower:address.toLowerCase(),
        registeredAtMillis: Date.now(), registeredAt: new Date().toISOString()
      });
      opCount++; uploaded++;
      if(opCount===450){ await batch.commit(); batch=writeBatch(db); opCount=0; statusEl.textContent = `Uploaded ${resumeFrom+uploaded} of ${rows.length}…`; }
    }
    if(opCount>0) await batch.commit();
    statusEl.textContent = '';
    showToast(`Import complete: ${uploaded} uploaded${resumeFrom?` (resumed after row ${resumeFrom})`:''}, ${skipped} skipped (missing OPD no. or name).`);
    lastVisibleDoc=null; await loadPatientsPage(true); await computeNextOpdNo();
  }catch(e){
    console.error(e);
    statusEl.textContent = 'Import failed — check the browser console for details.';
  }
};

    <div class="form-grid">
      <div class="field"><label>Medicine name</label><input id="mf-name" type="text" value="${escapeHtml(m?m.name:'')}"></div>
      <div class="field"><label>Batch no.</label><input id="mf-batch" type="text" value="${escapeHtml(m?m.batch:'')}"></div>
      <div class="field"><label>Expiry date</label><input id="mf-expiry" type="date" value="${m?m.expiry:''}"></div>
      <div class="field"><label>Quantity</label><input id="mf-qty" type="number" min="0" value="${m?m.quantity:''}"></div>
      <div class="field"><label>Unit</label><input id="mf-unit" type="text" value="${m?escapeHtml(m.unit):''}"></div>
      <div class="field"><label>Reorder level</label><input id="mf-reorder" type="number" min="0" value="${m?m.reorderLevel:''}"></div>
    </div>
    <div class="row-actions" style="margin-top:6px;">
      <button class="btn btn-primary" onclick="saveMedForm()">${m?'Save changes':'Add to inventory'}</button>
      ${m?`<button class="btn btn-outline" onclick="state.editingMed=null; render();">Cancel</button>`:''}
    </div></div>`;
  const rows=list.map(x=>{const s=medStatus(x); return `<tr>
    <td>${escapeHtml(x.name)}</td><td class="mono">${escapeHtml(x.batch)}</td><td class="mono">${escapeHtml(x.expiry)}</td>
    <td class="mono">${escapeHtml(x.quantity)} ${escapeHtml(x.unit)}</td><td class="mono">${escapeHtml(x.reorderLevel)}</td>
    <td><span class="badge ${s.cls}">${s.label}</span></td>
    <td class="row-actions"><button class="btn btn-outline btn-small" onclick="editMed('${x.id}')">Edit</button><button class="btn btn-danger btn-small" onclick="deleteMed('${x.id}')">Delete</button></td>
  </tr>`;}).join('');
  return adminShell(`
    <h2 class="display">Medicine Inventory</h2>${formCard}
    <div class="toolbar"><input type="text" placeholder="Search by name or batch" value="${escapeHtml(state.medSearch)}" oninput="state.medSearch=this.value; render();"><span style="font-size:13px;color:var(--text-muted);">${list.length} item(s)</span></div>
    <div class="table-wrap">${list.length?`<table><thead><tr><th>Name</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Reorder at</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty-state"><div class="icon">💊</div>No medicines match your search yet.</div>`}</div>
  `);
}
function viewAdminAppointments(){
  const rows=state.data.appointments.map(a=>`<tr>
    <td>${escapeHtml(a.name)}</td><td class="mono">${escapeHtml(a.phone)}</td><td class="mono">${escapeHtml(a.date)}</td><td>${escapeHtml(a.reason)}</td>
    <td><select onchange="updateAppointmentStatus('${a.id}',this.value)">${['pending','confirmed','done','cancelled'].map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><button class="btn btn-danger btn-small" onclick="deleteAppointment('${a.id}')">Delete</button></td></tr>`).join('');
  return adminShell(`<h2 class="display">Appointment Requests</h2>
    <div class="table-wrap">${state.data.appointments.length?`<table><thead><tr><th>Name</th><th>Phone</th><th>Preferred date</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty-state"><div class="icon">📅</div>No appointment requests yet.</div>`}</div>`);
}
function viewAdminInfo(){
  const i=state.data.info;
  return adminShell(`<h2 class="display">Clinic Info</h2>
    <div class="card" style="margin-bottom:20px;">
      <div class="form-grid">
        <div class="field"><label>Clinic name</label><input id="if-name" type="text" value="${escapeHtml(i.clinicName)}"></div>
        <div class="field"><label>Phone</label><input id="if-phone" type="text" value="${escapeHtml(i.phone)}"></div>
        <div class="field" style="grid-column:1/-1;"><label>Tagline</label><input id="if-tagline" type="text" value="${escapeHtml(i.tagline)}"></div>
        <div class="field" style="grid-column:1/-1;"><label>Address</label><input id="if-address" type="text" value="${escapeHtml(i.address)}"></div>
        <div class="field"><label>Hours</label><input id="if-hours" type="text" value="${escapeHtml(i.hours)}"></div>
        <div class="field" style="grid-column:1/-1;"><label>Welcome text (shown on the About page)</label><textarea id="if-welcome" rows="6">${escapeHtml(i.welcomeText||'')}</textarea></div>
        <div class="field" style="grid-column:1/-1;"><label>About us / history</label><textarea id="if-about" rows="5">${escapeHtml(i.aboutUsText||'')}</textarea></div>
        <div class="field"><label>Founder name</label><input id="if-founder-name" type="text" value="${escapeHtml(i.founderName||'')}"></div>
        <div class="field"><label>Founder photo URL (optional)</label><input id="if-founder-photo" type="text" placeholder="https://…" value="${escapeHtml(i.founderPhotoUrl||'')}"></div>
      </div>
      <button class="btn btn-primary" onclick="saveClinicInfo()">Save clinic info</button>
    </div>
    <h3>Our Doctors</h3>${doctorEditor(i.doctors||[])}
    <h3>Clinical services</h3>${listEditor('services', i.services)}
    <h3>Lab tests</h3>${listEditor('labTests', i.labTests)}
  `);
}
function viewAdminBlog(){
  const posts=state.data.blogPosts;
  const rows=posts.map(p=>`<div class="card" style="margin-bottom:12px;">
    <div class="field"><label>Title</label><input type="text" value="${escapeHtml(p.title)}" onchange="updateBlogPost('${p.id}','title',this.value)"></div>
    <div class="field"><label>Body</label><textarea rows="3" onchange="updateBlogPost('${p.id}','body',this.value)">${escapeHtml(p.body)}</textarea></div>
    <button class="btn btn-danger btn-small" onclick="removeBlogPost('${p.id}')">Delete post</button></div>`).join('');
  return adminShell(`<h2 class="display">Blog Posts</h2><button class="btn btn-primary" style="margin-bottom:16px;" onclick="addBlogPost()">+ New post</button>${rows||`<div class="empty-state"><div class="icon">📝</div>No posts yet.</div>`}`);
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  const needsAuth = state.view.startsWith('admin-') && state.view!=='admin-login';
  let html;
  if(needsAuth && !state.isAdmin){ html = viewAdminLogin(); }
  else{
    switch(state.view){
      case 'home': html=viewHome(); break;
      case 'about': html=viewAbout(); break;
      case 'services': html=viewServices(); break;
      case 'blog': html=viewBlog(); break;
      case 'book': html=viewBook(); break;
      case 'admin-login': html= state.isAdmin ? viewAdminDashboard() : viewAdminLogin(); break;
      case 'admin-dashboard': html=viewAdminDashboard(); break;
      case 'admin-patients': html=viewAdminPatients(); break;
      case 'admin-inventory': html=viewAdminInventory(); break;
      case 'admin-appointments': html=viewAdminAppointments(); break;
      case 'admin-info': html=viewAdminInfo(); break;
      case 'admin-blog': html=viewAdminBlog(); break;
      default: html=viewHome();
    }
  }
  app.innerHTML = html;
}
window.render = render;
window.state = state;

async function initApp(){
  await loadClinicInfo();
  await loadBlogPosts();
  render();
}
initApp();
</script>
</body>
</html>
